/* ---- 印刷 ---- */
/* 分割印刷の割り付け（用紙の四辺 10mm は余白。印刷できない端を避ける） */
function tileSpec(mode) {
  const paper = mode === 'a4' ? { pw: 210, ph: 297, name: 'A4' } : { pw: 420, ph: 297, name: 'A3' };
  const m = 10, rw = paper.pw - 2 * m, rh = paper.ph - 2 * m;
  return Object.assign(paper, { m, rw, rh, cols: Math.ceil(MAP.w / rw), rows: Math.ceil(MAP.h / rh) });
}
function buildMapPrint(mode, grid, qr, mono) {
  const W = MAP.w, H = MAP.h;
  const svg = withMono(mono, () => mapSvg(mapPlan(), { grid, qr, width: W + 'mm', height: H + 'mm' }));
  if (mode === 'full') return { css: `@page{size:${W}mm ${H}mm;margin:0}`, html: `<div class="ptile" style="width:${W}mm;height:${H}mm">${svg}</div>`, pages: 1 };
  const t = tileSpec(mode), total = t.cols * t.rows, parts = [];
  for (let r = 0; r < t.rows; r++) {
    for (let c = 0; c < t.cols; c++) {
      const n = r * t.cols + c + 1, x = c * t.rw, y = r * t.rh, w = Math.min(t.rw, W - x), h = Math.min(t.rh, H - y);
      parts.push(`<div class="ptile" style="width:${t.pw}mm;height:${t.ph}mm">` +
        `<div class="plabel">${t.name} ${n}/${total}（上から${r + 1}段目・左から${c + 1}枚目）　枠線で切って、番号順に貼り合わせる</div>` +
        `<div class="pregion" style="left:${t.m}mm;top:${t.m}mm;width:${w}mm;height:${h}mm"><div class="pinner" style="left:${-x}mm;top:${-y}mm;width:${W}mm;height:${H}mm">${svg}</div></div></div>`);
    }
  }
  return { css: `@page{size:${t.pw}mm ${t.ph}mm;margin:0}`, html: parts.join(''), pages: total };
}
/* A4縦に、決まった大きさの絵を格子状に並べる。mirror は両面印刷（長辺とじ）で裏をそろえるために左右を入れ替える（いまは使っていない） */
function gridPages(items, cw, ch, cols, rows, ox, oy, mirror) {
  const per = cols * rows, pages = [];
  for (let p = 0; p * per < items.length; p++) {
    const cells = items.slice(p * per, p * per + per).map((svg, i) => {
      const c = mirror ? cols - 1 - (i % cols) : i % cols, r = Math.floor(i / cols);
      return `<div class="pcell" style="left:${ox + c * cw}mm;top:${oy + r * ch}mm;width:${cw}mm;height:${ch}mm">${svg}</div>`;
    });
    pages.push(`<div class="ptile" style="width:210mm;height:297mm">${cells.join('')}</div>`);
  }
  return pages;
}
function buildCardPrint(qr, mono) {
  const svg = withMono(mono, () => cardSvg({ qr, width: '210mm', height: '148mm' }));
  return { css: '@page{size:210mm 297mm;margin:0}', html: gridPages([svg, svg], 210, 148.5, 1, 2, 0, 0).join(''), pages: 1 };
}

function buildLandscapePrint(svg) {
  return { css: '@page{size:297mm 210mm;margin:0}', html: `<div class="ptile" style="width:297mm;height:210mm">${svg}</div>`, pages: 1 };
}
function buildGuidePrint(mono) {
  const pages = withMono(mono, () => guidePages(mapPlan()));
  return { css: '@page{size:210mm 297mm;margin:0}', html: pages.map(p => `<div class="ptile"><div class="gpage gsheet${mono ? ' mono' : ''}">${p}</div></div>`).join(''), pages: pages.length };
}
function doPrint(job) {
  const area = document.getElementById('printarea');
  let st = document.getElementById('pagestyle');
  if (!st) { st = document.createElement('style'); st.id = 'pagestyle'; document.head.appendChild(st); }
  area.innerHTML = job.html;
  st.textContent = job.css;
  document.body.classList.add('print-mode');
  const done = () => { document.body.classList.remove('print-mode'); area.innerHTML = ''; st.textContent = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}

/* ============================== セルフテスト ============================== */
/* index.html?test=1 で開くと、計算・文言・送信処理・画面の検証を行う（通常の利用では動かない） */
function runSelfTest() {
  const out = [];
  let pass = 0, fail = 0;
  const ok = (cond, label, extra) => {
    if (cond) { pass++; out.push(['ok', 'PASS  ' + label]); }
    else { fail++; out.push(['ng', 'FAIL  ' + label + (extra !== undefined ? '  → ' + extra : '')]); }
  };
  const D = s => new Date(s + 'T12:00:00+09:00');
  const NOW = D('2026-10-07');
  const stats = [];
  let seed = 20261007;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const shuffle = arr => arr.map(x => [rnd(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const uniq = arr => new Set(arr).size === arr.length;
  const col = name => RECORD_HEADERS.indexOf(name);
  const axesAll = x => { const o = {}; ITEM_IDS.forEach(id => { o[id] = x; }); return o; };
  const randAxes = () => { const o = {}; ITEM_IDS.forEach(id => { o[id] = pick(STEP_VALUES); }); return o; };
  const randInput = () => ({ grad: pick(gradOptions(NOW)).key, stage: pick(STAGES).key, axes: randAxes(),
    values: shuffle(VALUE_IDS).slice(0, 2), conds: shuffle(COND_IDS).slice(0, Math.floor(rnd() * 3)),
    fields: shuffle(FIELD_IDS).slice(0, Math.floor(rnd() * 4)), forms: [], themes: shuffle(THEMES.map(t => t.key)).slice(0, Math.floor(rnd() * 4)) });
  const bad = s => /undefined|null|NaN|\{\w+\}/.test(s);
  /* テスト中は、URLの指定（会場用・共用端末など）に左右されないようにし、途中保存もしない。最後に元へ戻す */
  const savedParams = JSON.parse(JSON.stringify(params));
  Object.assign(params, { event: '', here: [], test: true, profile: false, admin: false, poster: false, kiosk: false, quick: false });
  resetMapCache();

  // --- 1. データの整合性 ---
  ok(ITEMS.length === 14 && uniq(ITEM_IDS) && uniq(VALUE_IDS) && uniq(COND_IDS) && uniq(FIELD_IDS) && uniq(FORM_IDS) && uniq(THEMES.map(t => t.key)) && uniq(SUPPORTERS.map(s => s.id)) && uniq(TENDENCIES.map(t => t.id)) && uniq(INSIGHTS.map(x => x.id)), 'IDが重複していない（質問14問）');
  ok(ITEMS.every(it => SECTIONS[it.sec] && it.name && it.q.lo && it.q.hi && it.q.lo !== it.q.hi && it.ask && it.check && ['lo', 'hi'].every(k => it[k].label && it[k].axis && it[k].probe)), '全質問に A・B の文、両端の名前・軸の文・深める問い・サポーターへの質問・確かめ方がそろっている');
  ok(ITEMS.every(it => /こと$/.test(it.lo.axis) && /こと$/.test(it.hi.axis)) && VALUES.every(x => /こと$/.test(x.axis)), '軸の文はすべて「〜こと」で終わる（例文に当てはめても自然な形）');
  ok(TENDENCIES.every(T => Object.keys(T.items).length >= 2 && Object.keys(T.items).every(id => ITEM[id] && T.items[id] !== 0) && T.neg.label && T.pos.label && T.neg.prefix && T.pos.noun && T.check), '傾向は2問以上を束ね、名前・タイプ名の部品・確かめ方がそろっている');
  const owners = {};
  TENDENCIES.forEach(T => Object.keys(T.items).forEach(id => { owners[id] = (owners[id] || 0) + 1; }));
  ok(Object.keys(owners).every(id => owners[id] === 1), '1つの質問は1つの傾向にだけ属する（同じ答えを二重に数えない）');
  const supProblems = SUPPORTERS.map(s => s.id + ':' + validateSupporter(s).join(',')).filter(x => !/:$/.test(x));
  ok(supProblems.length === 0, 'サポーターのデータの形が正しい', supProblems.join(' '));
  ok(INDUSTRIES.every(x => x.name && x.hint && Object.keys(x.v).length >= 4 && Object.keys(x.v).every(id => ITEM[id] && Math.abs(x.v[id]) <= 1)), '業界の目安のデータがそろっている');

  // --- 2. 質問文のかたより ---
  let sideBad = [];
  TENDENCIES.forEach(T => {
    const posIsA = Object.keys(T.items).map(id => (T.items[id] > 0) === !!ITEM[id].flip);
    if (posIsA.indexOf(true) < 0 || posIsA.indexOf(false) < 0) sideBad.push(T.name);
  });
  ok(sideBad.length === 0, 'どの傾向も、片方の極が A 側にも B 側にも出てくる（A・Bどちらかばかり選ぶ癖が傾向に見えない）', sideBad.join(','));
  const flips = ITEMS.filter(it => it.flip).length;
  ok(flips >= 3 && flips <= 11, `A・B の入れ替えは全体の一部（${flips}問）`);
  const lenBad = ITEMS.filter(it => { const r = it.q.lo.length / it.q.hi.length; return r < 0.6 || r > 1.67; }).map(it => it.id);
  ok(lenBad.length === 0, 'A・B の文の長さが大きく違わない（説明の多いほうが選ばれやすくなるのを防ぐ）', lenBad.join(','));
  const wordBad = ITEMS.filter(it => /もうけ|目立たない|地味|退屈|浅い|ワクワク|しかない|安心できる/.test(it.q.lo + it.q.hi)).map(it => it.id);
  ok(wordBad.length === 0, '質問文に、片方だけを良く・悪く見せる言葉を使っていない', wordBad.join(','));
  const allAsks = ITEMS.map(it => it.ask).concat(THEMES.map(t => t.question), [UNDECIDED.ask]);
  const askBad = allAsks.filter(q => /入社して|働いてみて|実際に働い|職場では|上司/.test(q));
  ok(askBad.length === 0 && ITEMS.every(it => /？$/.test(it.ask)), 'サポーター（内定者）への質問に「働いた経験」を前提にしたものがない', askBad.join(' / '));
  const posText = [COMPARE_STEP, EXPLORE_STEP, CENTER_PITCH, IMAGE_NOTE].concat(ITEMS.map(it => it.check), INSIGHTS.map(x => x.check), TENDENCIES.map(T => T.check));
  ok(posText.every(t => !/上の|下の|上に|下に/.test(t)), '画面とメールで共通の文に、位置の言葉（上の・下の）を使っていない');

  // --- 3. 傾向・タイプ・下書き ---
  const tsPos = tendencyScores(axesAll(0));
  const allPos = {}; TENDENCIES.forEach(T => Object.keys(T.items).forEach(id => { allPos[id] = Math.sign(T.items[id]); }));
  const tp = tendencyScores(allPos);
  const allNeg = {}; Object.keys(allPos).forEach(id => { allNeg[id] = -allPos[id]; });
  const tn = tendencyScores(allNeg);
  ok(tp.every(t => Math.abs(t.m - 1) < 1e-9 && t.level === 'はっきり') && tn.every(t => Math.abs(t.m + 1) < 1e-9), '同じ方向の答えがそろうと、傾向は端（±1）で「はっきり」になる');
  ok(tsPos.every(t => t.m === 0 && t.level === 'こだわり少なめ'), '全部「どちらとも」なら、傾向はすべて中央で「こだわり少なめ」');
  const mix = axesAll(0); mix.change = 1; mix.age = -1;
  ok(tendencyScores(mix)[0].level === '条件しだい', '反対向きの答えが打ち消し合うと「条件しだい」と判定する');
  let nameBad = '';
  TENDENCIES.forEach((T1, i) => TENDENCIES.forEach((T2, j) => {
    if (i === j) return;
    [T1.neg, T1.pos].forEach(p1 => [T2.neg, T2.pos].forEach(p2 => { const n = p1.prefix + p2.noun; if (bad(n) || n.length > 24) nameBad = n; }));
  }));
  ok(!nameBad, 'タイプ名：48通りの組み合わせがすべて正しく組み立てられる', nameBad);
  const rz = analyze({ grad: 'unknown', stage: 'none', axes: axesAll(0), values: ['growth', 'bond'] }, NOW, {});
  ok(rz.undecided && rz.draft.length === 0 && rz.insights.length === 0 && rz.type.name === UNDECIDED.name, '全部「どちらとも」→「これから軸を見つけるタイプ」。無理に軸を作らない');
  const r1 = analyze({ grad: 'unknown', stage: 'none', axes: Object.assign(axesAll(0), { change: 1, age: 1, disc: -1, spec: 0.5 }), values: ['growth', 'bond'] }, NOW, {});
  ok(!r1.undecided && r1.type.name.indexOf('変化を楽しむ') === 0 && r1.draft.length === 3 && r1.draft[0].group === 'move' && r1.draft[1].id === 'spec' && r1.draft[2].group === 'move',
    '挑戦側の答えがそろうと「変化を楽しむ〜」になり、下書きは挑戦の軸を先頭に、別の観点（専門）を挟んでから同じ傾向で補う', r1.type.name + ' / ' + r1.draft.map(a => a.id));
  const rs = analyze(sampleInput(NOW), NOW, {});
  ok(rs.draft.length === 3 && rs.draft.every(a => a.text && a.probe && /はっきり|やや/.test(a.level)) && rs.insights.length >= 1, '見本の回答で、下書き3つと「組み合わせから見えること」が出る', rs.draft.map(a => a.id).join(',') + ' / ' + rs.insights.map(x => x.id).join(','));

  // --- 4. ランダムな2万通り ---
  const groupOfId = id => { const G = TENDENCIES.find(T => T.items[id]); return G ? G.id : id; };
  const problems = [], shown = {}, firstWins = {}, in3 = {}, indWins = {}, kinds = {};
  let undecidedN = 0;
  const POOL = matchPool();
  POOL.forEach(s => { firstWins[s.id] = 0; in3[s.id] = 0; });
  for (let n = 0; n < 20000; n++) {
    const inp = randInput();
    const here = n % 4 === 0 ? POOL.filter(() => rnd() < 0.3).map(s => s.id) : [];
    const r = analyze(inp, NOW, { here });
    if (r.undecided) undecidedN++;
    if (r.draft.length > 3 || !uniq(r.draft.map(a => a.id)) || r.draft.some(a => Math.abs(r.v[a.id]) < 0.5)) problems.push('下書きの数・重複・弱い答え');
    if (!r.undecided && !r.draft.length && strengthOf(r.v) > 4) problems.push('下書きが空');
    const groups = r.draft.map(a => a.group);
    if (!uniq(groups) && ITEM_IDS.some(id => Math.abs(r.v[id]) >= 0.5 && groups.indexOf(groupOfId(id)) < 0)) problems.push('下書きが同じ傾向に偏っている');
    if (r.insights.length > 2 || (r.insights.length === 2 && r.insights[0].id === r.insights[1].id)) problems.push('組み合わせの数・重複');
    r.insights.forEach(x => { shown[x.id.split(':')[0] === 'mixed' || x.id.split(':')[0] === 'focus' ? x.id.split(':')[0] : x.id] = 1; kinds[x.kind] = (kinds[x.kind] || 0) + 1; if (bad(x.title + x.text + x.check)) problems.push('組み合わせの文の欠け ' + x.id); });
    if (bad(r.type.name) || r.tendencies.some(t => ['はっきり', 'やや', '条件しだい', 'こだわり少なめ'].indexOf(t.level) < 0 || t.min > t.m + 1e-9 || t.max < t.m - 1e-9)) problems.push('タイプ・傾向');
    if (r.examples.length !== 3 || !uniq(r.examples.map(t => t.s.id)) || r.everyone.length !== POOL.length || r.everyone.some(t => t.s.tentative)) problems.push('サポーターの人数・重複・仮の人');
    if (r.examples.some(t => !t.q || bad(t.q + t.why + t.label))) problems.push('サポーターへの質問の欠け');
    if (!uniq(r.examples.map(t => t.q))) problems.push('同じ質問が並ぶ');
    if (here.length && r.examples.slice(0, Math.min(here.length, 3)).some(t => !t.here)) problems.push('会場にいるサポーターが優先されていない');
    if (!r.undecided) { const nh = r.examples.filter(t => !t.here); for (let k = 1; k < nh.length; k++) if (nh[k - 1].score < nh[k].score - 1e-12) problems.push('重なりの大きい順になっていない'); }
    if (r.everyone.some(t => t.score < 0 || t.score > 1)) problems.push('重なりの範囲');
    if (r.steps.length < 2 || r.steps.length > 3 || r.steps.some(s => bad(s.title + s.text))) problems.push('次の一歩の欠け');
    if (r.questions.length < 1 || r.questions.length > 3 || !uniq(r.questions)) problems.push('相談の質問');
    if (!here.length && !r.undecided) { firstWins[r.examples[0].s.id]++; r.examples.forEach(t => { in3[t.s.id]++; }); indWins[r.industries[0].ind.name] = (indWins[r.industries[0].ind.name] || 0) + 1; }
  }
  ok(problems.length === 0, 'ランダムな2万通りで、下書き・傾向・組み合わせ・サポーター（3人・重複なし・会場にいる人優先・重なり順・質問が重複しない）・次の一歩が欠けなく出る', problems.slice(0, 4).join(' / '));
  const neverShown = INSIGHTS.filter(x => !shown[x.id]).map(x => x.id).concat(['mixed', 'focus'].filter(k => !shown[k]));
  ok(neverShown.length === 0, '「組み合わせから見えること」の全パターンが、実際に結果に出うる', neverShown.join(','));
  const fw = Object.keys(firstWins).reduce((t, k) => t + firstWins[k], 0);
  const maxFirst = Math.max.apply(null, Object.keys(firstWins).map(k => firstWins[k])) / fw;
  ok(POOL.every(s => in3[s.id] / fw > 0.03), '登録済みの' + POOL.length + '名全員が、例の3人に入りうる（3%以上。仮の位置の人は出さない）', POOL.map(s => s.id + ' ' + (in3[s.id] / fw * 100).toFixed(0) + '%').join(' '));
  ok(maxFirst < 0.3, `例の1人目が特定のサポーターに偏らない（最大 ${(maxFirst * 100).toFixed(1)}%）`);

  document.getElementById('back').onclick = () => { Object.assign(params, { test: false }); resetState(); screenIntro(); };
  return { pass, fail, failed: out.filter(x => x[0] === 'ng').map(x => x[1]), stats };
}

/* ------------------------------ 起動 ------------------------------ */
function readParams(p) {
  params.event = sanitizeEvent(p.event || '');
  params.here = sanitizeHere(p.here || '');
  params.test = p.test === '1';
  params.profile = p.profile === '1';
  params.admin = p.admin === '1';
  params.poster = p.poster === '1';
  params.kiosk = p.kiosk === '1';
  params.quick = p.quick === '1';
}
function boot() {
  resetState();
  const start = () => (params.test ? runSelfTest() : params.admin ? screenAdmin() : params.poster ? screenPoster() : params.quick ? screenQuick() : screenIntro());
  if (IS_GAS && google.script.url) {
    google.script.url.getLocation(loc => { readParams(loc.parameter || {}); start(); });
  } else {
    const sp = new URLSearchParams(location.search);
    const p = {};
    sp.forEach((v, k) => { p[k] = v; });
    readParams(p);
    start();
  }
}
boot();
</script>
