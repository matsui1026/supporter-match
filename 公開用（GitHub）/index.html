<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>就活の軸診断</title>
<style>
/* ------------------------------------------------------------------
   配色：濃いネイビーを基調に、大学カラーのグリーン（#009A44）をアクセントに使う。
   #009A44 は白地の文字には薄い（コントラスト不足）ため、線・点・枠などの装飾に使い、
   文字には少し濃い --brand-ink、白文字を載せるボタンには --brand-fill を使う。
   値を変えたら ?test=1 の「配色」の検査を確認すること。
   ------------------------------------------------------------------ */
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#0d1726; --muted:#566275; --line:#dfe4ea;
  --navy:#0f2140; --navy-weak:#e9edf3; --navy-ink:#0f2140;
  --hero:#0b1626; --hero-2:#13223b;
  --brand:#009a44; --brand-ink:#00753a; --brand-fill:#007a36; --brand-weak:#e5f4ec; --brand-on-dark:#3dd68c;
  --warn:#8a5a00; --warn-weak:#fbf1dc;
  --bad:#b3261e; --bad-weak:#fbe9e7;
  --radius:14px;
  --shadow:0 1px 2px rgba(11,22,38,.05), 0 8px 24px rgba(11,22,38,.06);
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070d17; --card:#0e1828; --text:#e7ecf3; --muted:#9ba7b8; --line:#1f2c40;
    --navy:#3a64aa; --navy-weak:#14223a; --navy-ink:#b8cbee;
    --hero:#060c16; --hero-2:#0f1d33;
    --brand:#2bb673; --brand-ink:#5fd9a0; --brand-fill:#187a47; --brand-weak:#0e2a1d; --brand-on-dark:#3dd68c;
    --warn:#f0bb72; --warn-weak:#33270f;
    --bad:#f2b8b5; --bad-weak:#3a1d1b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070d17; --card:#0e1828; --text:#e7ecf3; --muted:#9ba7b8; --line:#1f2c40;
  --navy:#3a64aa; --navy-weak:#14223a; --navy-ink:#b8cbee;
  --hero:#060c16; --hero-2:#0f1d33;
  --brand:#2bb673; --brand-ink:#5fd9a0; --brand-fill:#187a47; --brand-weak:#0e2a1d; --brand-on-dark:#3dd68c;
  --warn:#f0bb72; --warn-weak:#33270f;
  --bad:#f2b8b5; --bad-weak:#3a1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  font-size:17px; line-height:1.75; -webkit-text-size-adjust:100%;
}
.wrap{max-width:680px; margin:0 auto; padding:24px 16px 64px}
.wrap.has-cta{padding-bottom:110px}
h1{font-size:1.5rem; line-height:1.4; margin:0 0 8px}
h2{font-size:1.1rem; line-height:1.5; margin:0 0 12px}
h3{font-size:1rem; margin:0 0 4px}
p{margin:0 0 12px}
.lead{color:var(--muted)}
.note{font-size:.86rem; color:var(--muted)}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.eyebrow{font-size:.78rem; font-weight:700; color:var(--brand-ink); letter-spacing:.08em; margin:0 0 4px}
.sec{display:flex; align-items:center; gap:10px}
.sec::before{content:""; flex:0 0 auto; width:4px; height:1.05em; background:var(--brand); border-radius:2px}
.subsec{font-size:.95rem; margin:20px 0 10px; padding-top:16px; border-top:1px solid var(--line)}
.points{margin:0 0 20px; padding-left:1.2em}
.points li{margin-bottom:6px}
.primary{
  display:block; width:100%; background:var(--navy); color:#fff; border:none; font:inherit;
  padding:15px 24px; border-radius:12px; font-weight:700; font-size:1.02rem; cursor:pointer; text-align:center; letter-spacing:.02em;
}
.primary.go{background:var(--brand-fill)}
.primary:disabled{opacity:.4; cursor:not-allowed}
.ghost{
  display:inline-block; background:transparent; color:var(--navy-ink); border:1.5px solid var(--line);
  padding:10px 20px; border-radius:10px; font:inherit; font-size:.95rem; cursor:pointer;
}
.ghost.wide{display:block; width:100%; text-align:center}
.linkbtn{background:none; border:none; color:var(--navy-ink); font:inherit; font-size:.92rem; cursor:pointer; padding:8px 0; text-decoration:underline}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.stack > * + *{margin-top:10px}
button:focus-visible, summary:focus-visible, select:focus-visible, input:focus-visible{outline:3px solid var(--brand); outline-offset:3px}

/* ---- ヒーロー ---- */
.hero{background:linear-gradient(160deg,var(--hero),var(--hero-2)); color:#fff; border:none}
.hero .eyebrow{color:var(--brand-on-dark)}
.hero h1{color:#fff}
.hero .lead, .hero p, .hero li{color:rgba(255,255,255,.88)}
.hero .note{color:rgba(255,255,255,.72)}
.hero .primary{background:#fff; color:#0b1626}
.rule{width:40px; height:3px; background:var(--brand); border-radius:2px; margin:12px 0 14px}
.typelabel{font-size:.8rem; color:rgba(255,255,255,.7); margin:0}
.typename{font-family:var(--serif); font-size:1.65rem; font-weight:700; line-height:1.4; margin:2px 0 6px; color:#fff; letter-spacing:.02em}
.typename .tp{display:inline-block}
.typesub{display:flex; flex-wrap:wrap; gap:6px; margin:0}
.typesub span{font-size:.76rem; font-weight:700; color:var(--brand-on-dark); border:1px solid rgba(61,214,140,.55); border-radius:999px; padding:1px 10px}
.hlead{font-size:.88rem; color:rgba(255,255,255,.75) !important; margin:0 0 10px}
.axes{list-style:none; margin:0; padding:0; counter-reset:ax}
.axes li{position:relative; padding:0 0 14px 36px; counter-increment:ax}
.axes li::before{content:counter(ax); position:absolute; left:0; top:2px; width:25px; height:25px; border-radius:50%; border:2px solid var(--brand-on-dark); color:var(--brand-on-dark); font-size:.8rem; font-weight:800; display:flex; align-items:center; justify-content:center}
.axes .ax{display:block; color:#fff; font-weight:700; line-height:1.55}
.axes .lv{display:inline-block; margin-left:6px; font-size:.7rem; font-weight:700; color:var(--brand-on-dark); border:1px solid var(--brand-on-dark); border-radius:4px; padding:0 6px; vertical-align:2px}
.axes .probe{display:block; font-size:.86rem; color:rgba(255,255,255,.74); line-height:1.6; margin-top:3px}
.vals{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:4px; padding-top:12px; border-top:1px solid rgba(255,255,255,.14)}
.vals .vl{font-size:.8rem; color:rgba(255,255,255,.7); margin-right:2px}
.vals .vc{font-size:.86rem; font-weight:700; color:#fff; background:rgba(255,255,255,.1); border-radius:999px; padding:2px 12px}
.vals .vc b{color:var(--brand-on-dark); margin-right:4px}

/* ---- 進捗・質問 ---- */
.progress{height:5px; background:var(--line); border-radius:999px; overflow:hidden; margin:0 0 8px}
.progress > i{display:block; height:100%; background:var(--brand); border-radius:999px; transition:width .25s}
.qmeta{display:flex; justify-content:space-between; font-size:.84rem; color:var(--muted); margin-bottom:18px}
.qmeta b{color:var(--brand-ink)}
.qtext{font-size:1.15rem; font-weight:700; line-height:1.6; margin:0 0 16px}
a.btnlink{display:block; text-align:center; text-decoration:none; box-sizing:border-box}
.btn{
  display:flex; gap:.8em; align-items:flex-start; width:100%; text-align:left; font:inherit; color:inherit;
  background:var(--card); border:1.5px solid var(--line); border-radius:10px;
  padding:13px 16px; margin:0 0 10px; cursor:pointer; transition:border-color .12s, background .12s;
}
.btn .key{flex:0 0 auto; color:var(--brand-ink); font-weight:700; min-width:1.2em; text-align:center}
.btn small{display:block; color:var(--muted); font-size:.8rem; line-height:1.4}
.btn.sel{border-color:var(--navy); background:var(--navy-weak)}
@media (hover:hover){ .btn:hover{border-color:var(--navy); background:var(--navy-weak)} }
.count{font-size:.84rem; color:var(--muted); margin:0 0 12px}
.count.full{color:var(--warn); font-weight:700}
.stmt{display:flex; gap:10px; align-items:flex-start; padding:14px 16px; border-radius:10px; font-weight:600; line-height:1.6}
.stmt.sa{background:var(--navy-weak)}
.stmt.sb{background:var(--brand-weak)}
.stmt .tag{flex:0 0 auto; width:1.8em; height:1.8em; margin-top:.1em; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:.85rem; font-weight:700}
.stmt.sa .tag{background:var(--navy)}
.stmt.sb .tag{background:var(--brand-fill)}
.scale{display:flex; justify-content:space-between; align-items:center; margin:18px 6px 4px; gap:6px}
.dot{border-radius:50%; border:3px solid; background:transparent; cursor:pointer; padding:0; flex:0 0 auto; transition:transform .08s, background .12s}
.dot.d0,.dot.d4{width:54px; height:54px}
.dot.d1,.dot.d3{width:42px; height:42px}
.dot.d2{width:30px; height:30px}
.dot.d0,.dot.d1{border-color:var(--navy)}
.dot.d3,.dot.d4{border-color:var(--brand)}
.dot.d2{border-color:var(--muted)}
.dot.d0.sel,.dot.d1.sel{background:var(--navy)}
.dot.d3.sel,.dot.d4.sel{background:var(--brand)}
.dot.d2.sel{background:var(--muted)}
.dot:active{transform:scale(.92)}
@media (hover:hover){
  .dot.d0:hover,.dot.d1:hover{background:var(--navy-weak)}
  .dot.d3:hover,.dot.d4:hover{background:var(--brand-weak)}
  .dot.d2:hover{background:var(--line)}
}
.scale-labels{display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted); margin:0 0 16px}
.scale-labels .la{color:var(--navy-ink); font-weight:700}
.scale-labels .lb{color:var(--brand-ink); font-weight:700}

/* ---- 入力 ---- */
.field{display:block; margin:0 0 14px}
.field > span{display:block; font-size:.9rem; font-weight:700; margin-bottom:4px}
.field input[type=text], .field select, .field textarea{width:100%; font:inherit; font-size:1.02rem; padding:11px 13px; border:1.5px solid var(--line); border-radius:8px; background:var(--card); color:var(--text)}
.field input[type=text]:focus{outline:3px solid var(--brand-weak); border-color:var(--brand)}
.hint{font-size:.84rem; color:var(--muted); margin:4px 0 0; min-height:1.4em}
.hint.ok{color:var(--brand-ink); font-weight:700}
.hint.ng{color:var(--bad)}
.consent{border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:4px 0 16px; background:var(--bg)}
.consent label{display:flex; gap:10px; align-items:flex-start; font-weight:700; cursor:pointer}
.consent input{width:22px; height:22px; flex:0 0 auto; margin-top:3px; accent-color:var(--brand-fill)}
.consent ul{margin:10px 0 0; padding-left:1.2em; font-size:.84rem; color:var(--muted)}
.consent li{margin-bottom:3px}
.checks{display:grid; grid-template-columns:1fr; gap:6px; margin:0 0 14px}
.checks label{display:flex; gap:8px; align-items:flex-start; font-size:.92rem; cursor:pointer}
.checks input{width:20px; height:20px; flex:0 0 auto; margin-top:3px; accent-color:var(--brand-fill)}
textarea.snippet{width:100%; min-height:150px; font-family:ui-monospace,Consolas,monospace; font-size:.8rem; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text)}
.seg-row{margin:0 0 14px}
.seg-labels{display:flex; justify-content:space-between; align-items:baseline; gap:6px; font-size:.78rem; color:var(--muted)}
.seg-labels b{color:var(--text); font-size:.86rem}
.seg{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:4px}
.seg button{font:inherit; font-size:.74rem; padding:8px 2px; border:1.5px solid var(--line); background:var(--card); color:var(--text); border-radius:6px; cursor:pointer}
.seg button.sel{background:var(--navy); border-color:var(--navy); color:#fff}
.tchips{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 6px}
.tchip{font:inherit; font-size:.86rem; padding:7px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; line-height:1.4}
.tchip.sel{border-color:var(--brand); background:var(--brand-weak); color:var(--brand-ink); font-weight:700}
.tchip.sel::before{content:"✓ "}
.label{font-size:.9rem; font-weight:700; margin:0 0 6px}

/* ---- バナー ---- */
.banner{border-radius:10px; padding:14px 16px; margin:0 0 14px; font-size:.94rem}
.banner.info{background:var(--navy-weak)}
.banner.ok{background:var(--brand-weak)}
.banner.warn{background:var(--warn-weak)}
.banner.bad{background:var(--bad-weak)}
.banner p:last-child{margin-bottom:0}
.demo-tag{display:inline-block; font-size:.76rem; font-weight:700; padding:2px 8px; border-radius:4px; background:var(--warn-weak); color:var(--warn); margin-bottom:6px}

/* ---- 結果：傾向 ---- */
.tend{padding:12px 0; border-top:1px solid var(--line)}
.tend:first-of-type{border-top:none; padding-top:2px}
.tend-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px}
.tend-head b{font-size:.95rem}
.lvl{font-size:.74rem; font-weight:700; padding:1px 8px; border-radius:4px; white-space:nowrap}
.lvl.s{background:var(--brand-weak); color:var(--brand-ink)}
.lvl.m{background:var(--navy-weak); color:var(--navy-ink)}
.lvl.c{background:var(--warn-weak); color:var(--warn)}
.lvl.n{background:var(--bg); color:var(--muted); border:1px solid var(--line)}
.tscale{display:grid; grid-template-columns:1fr 42% 1fr; align-items:center; gap:8px; font-size:.8rem; color:var(--muted); line-height:1.35}
.tscale .tl{text-align:right}
.tscale .on{color:var(--text); font-weight:800}
.ttrack{position:relative; height:18px}
.ttrack::before{content:""; position:absolute; left:0; right:0; top:8px; height:2px; background:var(--line); border-radius:2px}
.ttrack::after{content:""; position:absolute; left:50%; top:3px; width:1px; height:12px; background:var(--muted); opacity:.5}
.tlane{position:absolute; left:8px; right:8px; top:0; bottom:0}
.tlane .band{position:absolute; top:5px; height:8px; border-radius:999px; background:var(--brand-weak); border:1px solid var(--brand); opacity:.9}
.tlane .pt{position:absolute; top:2px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--brand-fill); border:2px solid var(--card); box-shadow:0 0 0 1px var(--brand-fill)}
.tlane .pt.zero{background:var(--card); box-shadow:0 0 0 2px var(--muted)}
.why{font-size:.82rem; color:var(--muted); margin:6px 0 0}
.why b{color:var(--text); font-weight:700}
.ins{border-radius:12px; padding:14px 16px; margin:0 0 10px; background:var(--bg); border:1px solid var(--line)}
.ins .kind{display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.06em; padding:1px 8px; border-radius:4px; margin-bottom:4px}
.ins.combo .kind{background:var(--navy-weak); color:var(--navy-ink)}
.ins.tension .kind{background:var(--warn-weak); color:var(--warn)}
.ins.focus .kind{background:var(--brand-weak); color:var(--brand-ink)}
.ins h3{font-size:1rem; margin:0 0 4px}
.ins p{font-size:.9rem; margin:0}
.ins .chk{margin-top:8px; font-size:.86rem; color:var(--muted)}
.ins .chk b{color:var(--text); margin-right:6px}

/* ---- 結果：サポーター・業界・次の一歩 ---- */
.chip{display:inline-block; font-size:.74rem; padding:2px 8px; border-radius:4px; background:var(--navy-weak); color:var(--navy-ink); font-weight:700; white-space:nowrap}
.chip.here{background:var(--brand-weak); color:var(--brand-ink)}
.chip.soft{background:var(--bg); color:var(--muted); border:1px solid var(--line)}
.sup{padding:14px 0; border-top:1px solid var(--line)}
.sup:first-of-type{border-top:none; padding-top:0}
.sup-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.avatar{flex:0 0 auto; min-width:52px; padding:7px 10px; border-radius:8px; background:var(--navy); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:.95rem; white-space:nowrap}
.sup-head{flex-wrap:nowrap; align-items:flex-start}
.sup-name{flex:1 1 0; min-width:0; line-height:1.4}
.sup-name b{display:block}
.sup-name .sub{display:block; font-size:.82rem; color:var(--muted)}
.sup-name .chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px}
.sup p{margin:6px 0 0; font-size:.9rem}
.quote{font-family:var(--serif); font-size:1rem !important; font-weight:700; margin:10px 0 0 !important; padding-left:12px; border-left:3px solid var(--brand)}
.fit{color:var(--brand-ink)}
.fit b, .diff b{font-weight:700; margin-right:6px}
.gapline{background:var(--warn-weak); color:var(--warn); border-radius:8px; padding:6px 10px}
.ask{background:var(--bg); border-radius:8px; padding:8px 12px; margin-top:8px !important}
.ask b{color:var(--muted); font-size:.78rem; display:block}
details.more{margin-top:12px; border-top:1px solid var(--line); padding-top:10px}
details.more summary{cursor:pointer; color:var(--navy-ink); font-weight:700; font-size:.9rem}
.everyone{list-style:none; margin:8px 0 0; padding:0}
.everyone li{padding:8px 0; border-bottom:1px solid var(--line); font-size:.88rem}
.everyone li:last-child{border-bottom:none}
.steps{list-style:none; margin:0; padding:0; counter-reset:st}
.steps li{position:relative; padding:0 0 14px 42px; counter-increment:st}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(st); position:absolute; left:0; top:0; width:28px; height:28px; border-radius:50%; background:var(--navy); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:.86rem}
.steps b{display:block; font-size:.88rem; color:var(--navy-ink)}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px}
.tags span{font-size:.82rem; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--navy-weak); color:var(--navy-ink)}
.tags span.s{background:var(--brand-weak); color:var(--brand-ink)}
.item{padding:10px 0; border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.item p{margin:2px 0 0; font-size:.88rem}
.rawmap .gh{font-size:.78rem; font-weight:700; color:var(--brand-ink); margin:12px 0 2px}
.rrow{display:grid; grid-template-columns:1fr 34% 1fr; align-items:center; gap:8px; font-size:.74rem; color:var(--muted); margin:4px 0; line-height:1.35}
.rrow .l{text-align:right}
.rrow b{color:var(--text)}
.rtrack{position:relative; height:12px}
.rtrack::before{content:""; position:absolute; left:0; right:0; top:5px; height:2px; background:var(--line)}
.rtrack i{position:absolute; top:1px; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:var(--navy)}
dl.center{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0 0 14px; font-size:.92rem}
dl.center dt{color:var(--muted); font-weight:700}
dl.center dd{margin:0}
.ph{color:var(--muted); background:var(--warn-weak); padding:0 6px; border-radius:4px; font-size:.86em; font-weight:400}
.divider{height:1px; background:var(--line); margin:20px 0}
.formhead{font-size:1.05rem; margin:0 0 4px}
.demo-card summary{cursor:pointer; color:var(--navy-ink); font-weight:700; padding:6px 0}
.mailpreview{margin-top:8px; padding:16px; border:1px solid var(--line); border-radius:8px; background:#fff; color:#0d1726; overflow-x:auto}
table.rec{width:100%; border-collapse:collapse; font-size:.84rem; margin:6px 0 14px}
table.rec th,table.rec td{border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
table.rec th{color:var(--muted); white-space:nowrap; width:7em}

/* ---- 受け取り欄への近道（結果画面の下に固定） ---- */
.cta{position:fixed; left:0; right:0; bottom:0; z-index:20; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 70%, transparent); transition:transform .2s, opacity .2s}
.cta.off{transform:translateY(120%); opacity:0; pointer-events:none}
.cta button{display:block; width:100%; max-width:648px; margin:0 auto; box-shadow:0 6px 20px rgba(11,22,38,.25)}

/* ---- 相談メモ（見せる画面） ---- */
.overlay{position:fixed; inset:0; background:rgba(6,12,22,.62); z-index:50; overflow-y:auto; padding:16px; display:flex; justify-content:center; align-items:flex-start}
.memo{background:var(--card); color:var(--text); width:100%; max-width:520px; border-radius:14px; overflow:hidden; margin:auto 0; box-shadow:0 12px 40px rgba(0,0,0,.35)}
.memo .top{background:linear-gradient(160deg,var(--hero),var(--hero-2)); color:#fff; padding:16px 20px}
.memo .top p{margin:0 0 2px; font-size:.8rem; color:var(--brand-on-dark); font-weight:700; letter-spacing:.06em}
.memo .top h2{margin:0; color:#fff; font-size:1.25rem}
.memo .body{padding:14px 20px 20px}
.memo dl{margin:0 0 14px}
.memo dt{font-size:.8rem; color:var(--muted); font-weight:700; margin-top:10px}
.memo dd{margin:2px 0 0; font-weight:600}
.memo ol{margin:2px 0 0; padding-left:1.3em}

/* ---- サポーターの名前アイコン（会場マップ・結果画面で共通の色。角の丸い四角に下の名前） ---- */
.mk{display:inline-block; padding:1px 7px; border-radius:5px; color:#fff; font-weight:800; font-size:.8rem; line-height:1.5; margin-right:6px; white-space:nowrap; vertical-align:1px}

/* ---- 会場のスマホ6問（?quick=1） ---- */
.stk{display:inline-block; width:1em; height:1em; border-radius:50%; border:1px solid #333; vertical-align:-2px; margin-right:6px}
.qcell{font-size:2.1rem; font-weight:800; letter-spacing:.02em; margin:2px 0 4px; color:#fff}
.qquad{font-size:1.05rem; font-weight:800; color:var(--brand-on-dark); margin:0 0 4px}
.qstick{display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.12); border-radius:8px; padding:8px 12px; margin:10px 0 0; font-weight:700; color:#fff}
.near{list-style:none; margin:8px 0 0; padding:0}
.near li{padding:10px 0; border-bottom:1px solid var(--line); font-size:.9rem}
.near li:last-child{border-bottom:none}

/* ---- 結果画面の小さな2軸マップ ---- */
.qrrow{display:grid; grid-template-columns:150px 1fr; gap:14px; align-items:start; padding:12px 0; border-top:1px solid var(--line)}
.qrrow .qrimg{width:150px; height:150px; display:block; background:#fff; border-radius:6px}
@media (max-width:480px){ .qrrow{grid-template-columns:1fr} }
.minimap{display:grid; grid-template-columns:minmax(0,300px) 1fr; gap:14px; align-items:center; margin:2px 0 14px}
.minimap svg{display:block; width:100%; height:auto; border-radius:8px}
.minimap p{margin:0 0 6px; font-size:.88rem}
@media (max-width:480px){ .minimap{grid-template-columns:1fr} .minimap svg{max-width:320px} }

/* ---- 会場の印刷物（運営用の ?poster=1） ---- */
.posterbox{border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff}
.posterbox svg{display:block; width:100%; height:auto}
.guidebox{border:1px solid var(--line); border-radius:8px; background:#fff; color:#0d1726; padding:14px; overflow-x:auto}
.toc{display:flex; flex-wrap:wrap; gap:6px; margin:0}
.toc a{font-size:.84rem; color:var(--navy-ink); background:var(--navy-weak); border-radius:999px; padding:3px 12px; text-decoration:none; font-weight:700}
.demo-menu{display:grid; gap:8px}
/* 当日の運営シート（印刷・プレビュー共通。紙に刷るので色は固定） */
.gsheet{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif; color:#0d1726; font-size:9.4pt; line-height:1.5}
.gsheet h2{font-size:14pt; margin:0 0 1.5mm; color:#0f2140; border:none; padding:0}
.gsheet h3{font-size:10.5pt; margin:3.2mm 0 1.2mm; padding-left:2.5mm; border-left:1.2mm solid #009a44; color:#0f2140}

.gsheet ul, .gsheet ol{margin:0 0 1.5mm; padding-left:5mm}
.gsheet li{margin-bottom:.8mm}
.gsheet .gsub{color:#4b5768; font-size:8.6pt}

.gsheet th{background:#e9edf3; font-weight:700; white-space:nowrap}
.gsheet .say{background:#f4f6f8; border-radius:2mm; padding:1.4mm 2.5mm; margin:0 0 1.5mm}
.gsheet .say b{color:#00753a}
.gsheet .gmk{display:inline-block; padding:0 1.6mm; line-height:5.2mm; border-radius:1.2mm; color:#fff; font-weight:800; font-size:8.5pt; white-space:nowrap}
.gsheet .blank td{height:7mm}
.gsheet.mono h3{border-left-color:#111111}
.gsheet.mono th{background:#ffffff}
.gsheet.mono .say{background:#ffffff; border:0.25mm solid #9a9a9a}
.gsheet.mono .say b{color:#111111}
.gsheet.mono .gmk{background:#ffffff; color:#111111; border:0.3mm solid #111111}
.gpage{width:210mm; min-height:297mm; padding:10mm 12mm; background:#fff; box-sizing:border-box}
table.plan{width:100%; border-collapse:collapse; font-size:.84rem; margin:6px 0 10px}
table.plan th,table.plan td{border-bottom:1px solid var(--line); padding:6px 6px; text-align:left; vertical-align:top}
table.plan th{color:var(--muted); font-weight:700; white-space:nowrap}
.radios{display:grid; gap:6px; margin:0 0 12px}
.radios label{display:flex; gap:8px; align-items:flex-start; font-size:.92rem; cursor:pointer}
.radios input{width:20px; height:20px; flex:0 0 auto; margin-top:3px; accent-color:var(--brand-fill)}
#printarea{display:none}
@media print{
  body.print-mode{background:#fff}
  body.print-mode #wrap{display:none !important}
  body.print-mode #printarea{display:block}
}
.ptile{position:relative; overflow:hidden; background:#fff; break-after:page; page-break-after:always}
.ptile:last-child{break-after:auto; page-break-after:auto}
.plabel{position:absolute; left:10mm; top:3mm; font-size:3mm; line-height:1.2; color:#333; font-family:sans-serif; white-space:nowrap}
.pregion{position:absolute; overflow:hidden; outline:0.3mm solid #888}
.pinner{position:absolute}
.pcell{position:absolute; outline:0.2mm dashed #999}
.pcell svg{display:block}

.testline{font-family:ui-monospace,Consolas,monospace; font-size:.8rem; padding:2px 0; white-space:pre-wrap; word-break:break-all}
.testline.ng{color:var(--bad); font-weight:700}
.testline.ok{color:var(--brand-ink)}
@media (max-width:480px){
  body{font-size:16px}
  h1{font-size:1.3rem}
  .typename{font-size:1.45rem}
  .qtext{font-size:1.06rem}
  .wrap{padding:14px 16px 56px}
  .card{padding:16px}
  .dot.d0,.dot.d4{width:50px; height:50px}
  .dot.d1,.dot.d3{width:38px; height:38px}
  .tscale{grid-template-columns:1fr 36% 1fr; font-size:.76rem}
}
</style>

<body>
<div class="wrap" id="wrap"><main id="app" aria-live="polite"></main></div>
<div id="printarea"></div>

<script>
/* ==== ENGINE START ==== */
/* ============================================================================
   診断エンジン（画面とサーバーの両方で使う部分）
   - この範囲はブラウザでも Google Apps Script（gas/Code.gs）でも実行される。
     画面（document）や window には触れないこと。
   - サーバーはこの範囲を index.html から切り出して使う。文言・データ・計算の定義元はここだけ。
   - 診断のしくみ：14の質問（観点）→ 関係する質問を束ねた4つの「傾向」→ 答えの組み合わせから見えること。
     就活の軸の下書きは、傾向と一致する強い答えを優先して選ぶ。
   - サポーターは「内定を得た学生」。社会人ではないので、サポーターへの質問は
     「働いてみてどうか」ではなく「就活でどう考え、どう選んだか」を聞く形にする。
   - サポーターは「本人の志向」と「内定先の特徴」を分けて持つ（業界の典型と本人は同じとは限らない）。
   ============================================================================ */

/* ---------- 1. 運用設定（ここを書き換えて使う） ---------- */
const CONFIG = {
  appTitle: '就活の軸診断',
  eventTitle: 'サポーターマッチング',   // 会場のイベント名（暫定）。マップの見出しと運営シートに出す。空なら出さない
  appLead: '約4分・登録不要。仕事選びで大切にしたいことを見える化し、「就活の軸」の下書きをつくります。',
  centerName: 'キャリア開発センター',
  bookingUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSezSbIgdlMicJYm0e35kFORVO8TUMunoxxojlnBCXC0JFTLag/viewform',   // 個別面談の予約フォーム（結果画面とメールにボタンで出す）
  emailDomain: 'gl.aiu.ac.jp',
  studentIdExample: 'A1234567',
  senderName: 'キャリア開発センター 就活サポーター',
  retention: '',            // 参加記録の保存期間。例: '2027年3月末まで'（空なら「センターが定める期間」）
  receive: 'mail',          // 'mail'：結果の最後で学籍番号を入れると、参加記録と結果メールの送信（mailEndpoint が入っているときだけ欄が出る）。'none'：受け取り欄を出さない
  mailEndpoint: '',         // メール送信用の Google Apps Script のURL（…/exec）。「公開と設定の手順.md」の手順2で作って貼る。空のあいだは、公開ページに受け取り欄を出さない
  draft: false,             // true の間は未入力の項目を「（要入力）」と表示する（原案用）。本番は false
  live: true,               // 本番：公開したページにデモ版の表示やメニューを出さない（パソコンで index.html を直接開いたときは、運営メニューが出る）
  appUrl: 'https://matsui1026.github.io/supporter-match/',   // 公開するURL。会場とカードのQRコードは、ここから自動で作る（URLは固定のまま、中身だけ更新する）
  eventId: '1021',          // QRのURLに付けるイベント名（英数字）
  maxSendsPerIdPer6h: 3     // 同じ学籍番号から6時間以内に送れるメールの上限
};
/* 学籍番号の形式（正規化後の値に対して照合）: 英大文字1文字 + 数字7桁 */
const STUDENT_ID_RE = /^[A-Z][0-9]{7}$/;

/* ---------- 2. 質問（14の観点） ----------
   回答は 5段階。値は lo 側が -1、hi 側が +1（どちらとも = 0）で保存する。
   flip: true の質問は、画面で hi 側を「A」として先に出す（A・B どちらかばかり選ぶ癖が
         特定の傾向に見えてしまわないよう、傾向ごとに A 側・B 側を混ぜている。?test=1 で検査）。
   q     : 質問の文（lo 側・hi 側）。両方とも前向きな言い方・同じくらいの長さにそろえる
   axis  : 「就活の軸」の下書きに使う文（〜こと）　probe : 経験と結びつける問い
   ask   : センターやサポーターに聞く質問（就活でどう選んだかを聞く形）
   check : この観点を確かめる方法　company : 内定先の特徴として登録できる観点 */
const SECTIONS = ['会社のかたち', '扱うもの', '働き方', '職場とキャリア'];
const ITEMS = [
  { id: 'pub', sec: 0, name: '公共性', company: true,
    lo: { label: '公共・社会', axis: '社会に必要な制度やサービスを、公的な立場から支えること',
      probe: '「社会の役に立てた」と感じた経験はありますか？ ボランティアや授業、アルバイトの場面を思い出してみよう。' },
    hi: { label: '民間・ビジネス', axis: '商品やサービスで選ばれ、事業を伸ばしていくこと',
      probe: '目標に向かって工夫し、結果を出せた経験を思い出してみよう。何が一番うれしかったですか？' },
    q: { lo: '国や地域に必要な制度やサービスを、公的な立場から支える仕事がしたい',
         hi: '民間企業の一員として、商品やサービスで事業を伸ばす仕事がしたい' },
    ask: '公的機関と民間企業とで迷ったとき、何が決め手になりましたか？',
    check: '民間企業と公的機関の説明会に1つずつ参加して、どちらの話に惹かれたかを比べてみよう。' },
  { id: 'age', sec: 0, name: '会社の歴史', company: true, flip: true,
    lo: { label: '老舗・歴史', axis: '長い歴史の中で築かれた信頼や仕組みを受け継ぎ、育てていくこと',
      probe: '長く続いているものを大切にした経験はありますか？ 部活やサークルの伝統を引き継いだ場面などを思い出してみよう。' },
    hi: { label: '若い会社', axis: '会社や事業の形を、これから自分たちでつくっていくこと',
      probe: '何もないところから、新しい活動や仕組みを立ち上げた経験はありますか？ そのとき何が大変で、何が楽しかったですか？' },
    q: { lo: '長い歴史の中で築かれた信頼や仕組みを、受け継いで育てていきたい',
         hi: '若い会社で、仕組みや文化をこれから自分たちでつくっていきたい' },
    ask: '歴史のある会社と若い会社を比べたとき、どこを見て判断しましたか？',
    check: '創業年の古い会社と新しい会社を1社ずつ調べ、雰囲気や仕事の進め方を比べてみよう。' },
  { id: 'size', sec: 0, name: '会社の規模', company: true,
    lo: { label: '大規模', axis: '大きな組織の中で、整った環境と多様な人に支えられて働くこと',
      probe: '大人数の集団で役割を果たした経験はありますか？ 多くの人がいるからこそできたことは何でしたか？' },
    hi: { label: '小規模', axis: '少人数で、経営や他部署との距離が近い環境で働くこと',
      probe: '少人数のチームで、一人が複数の役割を担った経験はありますか？ その手応えの何がよかったですか？' },
    q: { lo: '社員が数千人規模で、部署や制度が整った会社で働きたい',
         hi: '社員が数十〜数百人規模で、経営者や他部署との距離が近い会社で働きたい' },
    ask: '会社の規模は、選ぶときにどのくらい重視しましたか？',
    check: '社員数の違う会社の説明会に出て、社員どうしの距離感を比べてみよう。' },
  { id: 'tang', sec: 1, name: '扱うものの形', company: true,
    lo: { label: '形のあるモノ', axis: '形のある製品を通して、世の中に価値を届けること',
      probe: '思わず人にすすめたくなった「モノ」はありますか？ その理由に、あなたの軸のヒントがあります。' },
    hi: { label: '形のないサービス', axis: 'お金・情報・サービスなど、形のない仕組みで価値をつくること',
      probe: '「この仕組み、よくできているな」と感じたサービスはありますか？ どこに惹かれたかを言葉にしてみよう。' },
    q: { lo: '形のある製品を、つくったり届けたりする仕事に惹かれる',
         hi: 'お金・情報・サービスなど、形のないもので価値を生む仕事に惹かれる' },
    ask: 'モノを扱う会社と、形のないものを扱う会社の違いを、どうやって調べましたか？',
    check: 'メーカーとサービス系の会社を1社ずつ調べ、仕事の中身を比べてみよう。' },
  { id: 'biz', sec: 1, name: '仕事の相手', company: true, flip: true,
    lo: { label: '企業向け', axis: '企業や産業を、裏側から支えること',
      probe: '表に出ない役割で、チームや活動を支えた経験はありますか？ そのやりがいを言葉にしてみよう。' },
    hi: { label: '消費者向け', axis: 'お客さんの反応を身近に感じられる、商品やサービスに関わること',
      probe: 'お客さんや身近な人に「ありがとう」と言われてうれしかった経験を思い出してみよう。' },
    q: { lo: '企業を相手に、産業やビジネスの土台を支える仕事に興味がある',
         hi: '一般の消費者を相手に、暮らしの中で使われる商品やサービスに関わりたい' },
    ask: '消費者向けと企業向けの会社を、どうやってイメージして比べましたか？',
    check: '消費者向けの会社と企業向けの会社を1社ずつ調べ、どちらの仕事に惹かれるか比べてみよう。' },
  { id: 'need', sec: 1, name: '扱うものの性格', company: true, flip: true,
    lo: { label: '暮らしの土台', axis: '人々の生活に欠かせないものを、安定して届けること',
      probe: '「これがないと困る」と感じたものや場面はありますか？ それを支えている人の仕事を想像してみよう。' },
    hi: { label: '楽しみ・彩り', axis: '人の気持ちを動かし、暮らしに楽しさや彩りを加えること',
      probe: '心が動いた体験（音楽・食・旅など）はありますか？ 何があなたの気持ちを動かしたのでしょう。' },
    q: { lo: '電気・食・医療のように、暮らしに欠かせないものを扱いたい',
         hi: '娯楽・旅・ファッションのように、暮らしを楽しく彩るものを扱いたい' },
    ask: '扱う商品やサービスの性格は、会社選びにどう影響しましたか？',
    check: '暮らしの土台を支える会社と、楽しみを届ける会社の話を聞き比べてみよう。' },
  { id: 'wlb', sec: 2, name: '仕事と私生活', company: false,
    lo: { label: '仕事に打ち込む', axis: '若いうちに仕事へ打ち込み、早く力をつけること',

    hi: { label: '私生活も大切に', axis: '仕事と私生活の両方を大切にし、長く続けられる働き方をすること',
      probe: '忙しい時期にどうやって自分の時間を守ってきましたか？ 自分が元気でいられる条件を考えてみよう。' },
    q: { lo: '若いうちは、仕事を生活の中心にして力をつけたい',
         hi: '若いうちから、仕事と私生活のバランスを大切にしたい' },
    ask: '働き方や休日の実態は、どうやって確かめましたか？',
    check: '同じ業界の2社で、休日や残業の実態を説明会などで比べてみよう。' },
  { id: 'scale', sec: 2, name: '仕事の規模感', company: false,
    lo: { label: '大きなスケール', axis: '多くの人や業界全体に影響する、規模の大きな仕事に関わること',
      probe: 'より大きな目標や舞台に挑戦した経験はありますか？ 何があなたをそこへ向かわせましたか？' },
    hi: { label: '身近な手応え', axis: '一人ひとりの顔が見える距離で、手応えを感じながら働くこと',
      probe: '身近な人の役に立てた経験を思い出してみよう。どんなときに手応えを感じましたか？' },
    q: { lo: '多くの人や業界全体に影響する、規模の大きな仕事に関わりたい',
         hi: '一人ひとりの顔が見える距離で、手応えを感じられる仕事がしたい' },
    ask: '仕事の「規模の大きさ」は、会社選びでどのくらい意識しましたか？',

}
function joinParts(parts) { return parts.filter(Boolean).join('や'); }

function sanitizeHere(list) {

}
function themeOf(key) { return THEMES.find(t => t.key === key) || null; }
/* 選択式の答え：知っている値だけ・重複なし・最大 max 個。条件を外れたら null（未回答は空の配列） */

}
function cleanThemes(list) { return cleanList(list, THEMES.map(t => t.key), MAX_THEMES); }
/* 14問の答え：14問すべてが 5段階のどれかであること。条件を外れたら null */
function cleanAxes(o) {

  const out = {};
  for (let i = 0; i < ITEM_IDS.length; i++) {

function labelOf(list, id) { const x = list.find(y => y.id === id); return x ? x.label : ''; }

/* ---------- 10. 卒業年度と就活の時期（日本時間で判定） ---------- */
function jstParts(now) {

/* 今年度に卒業する学年の卒業年（例: 2026年10月なら 2027 = 27卒） */
function currentBaseYear(now) { const p = jstParts(now); return p.m >= 4 ? p.y + 1 : p.y; }
const yy = n => String(n % 100).padStart(2, '0');
function gradOptions(now) {
  const b = currentBaseYear(now);
  return [
    { key: String(b),     label: yy(b) + '卒',         sub: '今年度に卒業予定' },
    { key: String(b + 1), label: yy(b + 1) + '卒',     sub: '来年度に卒業予定' },
    { key: String(b + 2), label: yy(b + 2) + '卒',     sub: '' },

function parseGradKey(key) {

}
function isValidGradKey(key, now) {
  const g = parseGradKey(key);

}

  if (d >= 2) return 'explore';
  if (d === 1) return (m >= 4 && m <= 8) ? 'y3_summer' : (m === 3 ? 'peak' : 'y3_autumn');

/* ---------- 11. 計算 ---------- */
function val(v, id) { return (v && typeof v[id] === 'number') ? v[id] : 0; }
function poleOf(id, x) { return x < 0 ? ITEM[id].lo : x > 0 ? ITEM[id].hi : null; }
function strengthOf(v) { return ITEM_IDS.reduce((t, id) => t + Math.abs(val(v, id)), 0); }
function levelWord(x) { return Math.abs(x) >= 1 ? 'はっきり' : 'やや'; }

/* 4つの傾向：関係する質問の答えを重みつきで平均する。帯（min〜max）は答えの広がり */
function tendencyScores(v) {
  return TENDENCIES.map((T, k) => {
    let num = 0, den = 0;
    const al = Object.keys(T.items).map(id => {
      const w = T.items[id], x = val(v, id), a = Math.sign(w) * x;
      num += Math.abs(w) * a; den += Math.abs(w);
      return { id, x, a };
    });
    const m = den ? num / den : 0;
    const min = Math.min.apply(null, al.map(z => z.a)), max = Math.max.apply(null, al.map(z => z.a));
    const am = Math.abs(m);
    const level = am >= LEVEL_STRONG ? 'はっきり' : am >= LEVEL_SOME ? 'やや' : (min <= -0.5 && max >= 0.5 ? '条件しだい' : 'こだわり少なめ');
    const s = m >= 0 ? 1 : -1;
    const by = (p, q) => Math.abs(q.a) - Math.abs(p.a);
    return {
      id: T.id, k, T, name: T.name, m, min, max, level,
      side: am >= LEVEL_SOME ? (m > 0 ? T.pos : T.neg) : null,
      pro: al.filter(z => z.a * s >= 0.5).sort(by).map(z => poleOf(z.id, z.x).label),
      con: al.filter(z => z.a * s <= -0.5).sort(by).map(z => poleOf(z.id, z.x).label)

  });
}
/* タイプ名：強い傾向の上位2つから組み立てる */
function typeOf(ts, undecided) {
  if (undecided) return { undecided: true, balanced: false, name: UNDECIDED.name, poles: [] };
  const strong = ts.filter(t => Math.abs(t.m) >= LEVEL_SOME).sort((a, b) => (Math.abs(b.m) - Math.abs(a.m)) || (a.k - b.k));
  const poles = strong.slice(0, 2).map(t => t.m > 0 ? t.T.pos : t.T.neg);
  if (poles.length === 2) return { undecided: false, balanced: false, name: poles[0].prefix + poles[1].noun, parts: [poles[0].prefix, poles[1].noun], poles };
  if (poles.length === 1) return { undecided: false, balanced: false, name: poles[0].prefix + 'タイプ', parts: [poles[0].prefix, 'タイプ'], poles };
  return { undecided: false, balanced: true, name: BALANCED.name, poles: [] };
}
/* 就活の軸の下書き：強い答えを、傾向と一致するものを優先して最大3つ。

function draftOf(v, ts, undecided) {
  if (undecided) return [];
  const link = {};
  TENDENCIES.forEach((T, k) => Object.keys(T.items).forEach(id => { link[id] = { w: T.items[id], t: ts[k] }; }));
  const ranked = ITEM_IDS.map((id, i) => {
    const x = val(v, id), L = link[id];
    let score = Math.abs(x) - i * 1e-6;
    if (L && Math.abs(L.t.m) >= LEVEL_SOME) score += (Math.sign(L.w) * x * L.t.m > 0) ? 0.5 * Math.abs(L.t.m) : -0.2;
    return { id, x, score, group: L ? L.t.id : id };
  }).filter(z => Math.abs(z.x) >= 0.5).sort((a, b) => b.score - a.score);
  const picked = [], seen = {};
  ranked.forEach(z => { if (picked.length < MAX_DRAFT && !seen[z.group]) { seen[z.group] = 1; picked.push(z); } });
  ranked.forEach(z => { if (picked.length < MAX_DRAFT && picked.indexOf(z) < 0) picked.push(z); });
  return picked.map(z => {
    const p = poleOf(z.id, z.x);
    return { id: z.id, group: z.group, label: p.label, text: p.axis, probe: p.probe, level: levelWord(z.x) };

/* 答えの組み合わせから見えること（2つまで。なるべく種類の違うもの） */
function insightsOf(v, ts, values, undecided) {
  if (undecided) return [];
  const c = { v: {}, t: {}, val: id => values.indexOf(id) >= 0 };

  ts.forEach(t => { c.t[t.id] = t.m; });
  const hits = INSIGHTS.filter(r => r.when(c)).map(r => ({ id: r.id, kind: r.kind, title: r.title, text: typeof r.text === 'function' ? r.text(c) : r.text, check: r.check }));
  ts.filter(t => t.level === '条件しだい').forEach(t => hits.push({

    text: '「' + t.pro[0] + '」と「' + t.con[0] + '」のように、' + t.name + 'について反対向きの答えがあります。どんな条件ならどちらを選ぶかを言葉にすると、軸がぐっと具体的になります。',
    check: '迷った質問について、「どんな会社なら」「どんな仕事なら」そちらを選ぶかを書き出してみよう。'
  }));
  const top = ts.filter(t => Math.abs(t.m) >= LEVEL_SOME).sort((a, b) => (Math.abs(b.m) - Math.abs(a.m)) || (a.k - b.k))[0];
  if (top) {
    const pole = top.m > 0 ? top.T.pos : top.T.neg;

      id: 'focus:' + top.id, kind: 'focus', title: '「' + pole.label + '」が一貫している',

/* 会社を見るときのものさし：はっきり答えた観点 */
function tagsOf(v) {
  return ITEMS.filter(x => Math.abs(val(v, x.id)) >= 0.5).map(x => ({ id: x.id, label: poleOf(x.id, val(v, x.id)).label, strong: Math.abs(val(v, x.id)) >= 1 }));
}
/* 業界の目安：値を持つ観点だけで近さを測る */
function rankIndustries(v) {
  return INDUSTRIES.map((ind, i) => {
    let num = 0, den = 0;
    const fit = [], off = [];
    Object.keys(ind.v).forEach(id => {
      const u = val(v, id), w = 0.2 + Math.abs(u), d = Math.abs(u - ind.v[id]);
      num += w * (1 - d / 2); den += w;
      if (Math.abs(u) >= 0.5) {

        if (d <= 0.75) fit.push(o); else if (d >= 1.25) off.push(o);
      }
    });
    fit.sort((a, b) => b.w - a.w); off.sort((a, b) => b.d - a.d);

  }).sort((a, b) => (b.score - a.score) || (a.i - b.i));

/* --- サポーターとの重なり：14問の近さ（8割）＋やりがいの一致（2割）＋分野の一致（少し） --- */
function findGap(s) {
  let best = null;
  Object.keys(s.company || {}).forEach(id => {
    const c = s.company[id], p = val(s.self, id);
    if (Math.abs(c) < 0.5 || Math.abs(p) < 0.5 || c * p > 0) return;
    const d = Math.abs(c - p);
    if (!best || d > best.d) best = { id, d, company: poleOf(id, c).label, self: poleOf(id, p).label };
  });
  return best;
}
/* サポーターたちの中で、その答え（観点と向き）を選んだ人の割合。多くのサポーターに共通する点より、珍しい共通点を先に見せるために使う */
function commonness() {
  const c = {};
  ITEM_IDS.forEach(id => { c[id + '+'] = 0; c[id + '-'] = 0; });
  const pool = matchPool();
  pool.forEach(s => ITEM_IDS.forEach(id => { const p = val(s.self, id); if (Math.abs(p) >= 0.5) c[id + (p > 0 ? '+' : '-')] += 1 / pool.length; }));
  return c;
}
function scoreSupporter(v, values, fields, s, common) {
  common = common || commonness();
  let num = 0, den = 0;
  ITEM_IDS.forEach(id => {
    const u = val(v, id), p = val(s.self, id), w = 0.3 + Math.abs(u);
    den += w; num += w * (1 - Math.abs(u - p) / 2);
  });
  const sharedValues = values.filter(x => (s.values || []).indexOf(x) >= 0);
  const valueSim = values.length ? sharedValues.length / Math.min(2, values.length) : 0;
  const sharedFields = fields.filter(f => (s.fields || []).indexOf(f) >= 0);
  const score = Math.min(1, 0.8 * (num / den) + 0.2 * valueSim + (sharedFields.length ? 0.03 : 0));
  const shared = [], differ = [];
  ITEM_IDS.forEach(id => {
    const u = val(v, id), p = val(s.self, id);
    if (Math.abs(u) < 0.5 || Math.abs(p) < 0.5) return;
    const rare = u * p > 0 ? 1.2 * common[id + (u > 0 ? '+' : '-')] : 0;
    (u * p > 0 ? shared : differ).push({ id, rank: Math.abs(u) + Math.abs(p) - rare, you: poleOf(id, u).label, sup: poleOf(id, p).label });
  });
  shared.sort((a, b) => b.rank - a.rank); differ.sort((a, b) => b.rank - a.rank);

function closeness(score) { return score >= 0.82 ? '重なりが大きい' : score >= 0.7 ? '重なる点が多い' : '重なる点もある'; }
/* サポーターに聞いてみたいこと：本人と内定先のずれ → 共通の観点 → 違う観点。同じ観点の質問が並ばないようにする */
function questionFor(r, undecided, used) {
  const free = list => list.filter(x => used.indexOf(x.id) < 0);
  if (undecided) {
    const ids = ITEM_IDS.filter(id => used.indexOf(id) < 0).sort((a, b) => Math.abs(val(r.s.self, b)) - Math.abs(val(r.s.self, a)));
    const id = ids[0] || ITEM_IDS[0];
    used.push(id);
    return { why: '「' + poleOf(id, val(r.s.self, id) || 1).label + '」をはっきり選んだサポーターです', q: ITEM[id].ask };
  }
  if (r.gap && used.indexOf('gap:' + r.gap.id) < 0) {
    used.push('gap:' + r.gap.id);
    return { why: '内定先のイメージと本人の志向が違うサポーターです', q: '「' + r.gap.company + '」寄りの会社ですが、「' + r.gap.self + '」寄りのサポーターがそこを選んだ決め手は何でしたか？' };
  }
  const sh = free(r.shared)[0];
  if (sh) { used.push(sh.id); return { why: '「' + sh.you + '」が共通しています', q: ITEM[sh.id].ask }; }
  const df = free(r.differ)[0];
  if (df) { used.push(df.id); return { why: 'あなたは「' + df.you + '」、サポーターは「' + df.sup + '」です', q: ITEM[df.id].ask }; }

/* 例として出すサポーター：会場にいる人を優先し、重なりの大きい順（軸が固まっていない学生には、軸がはっきりした順） */
function pickExamples(v, values, fields, here, undecided) {
  const hereIds = sanitizeHere(here);
  const common = commonness();
  const all = matchPool().map((s, i) => Object.assign(scoreSupporter(v, values, fields, s, common), {
    s, index: i, name: displayName(s), industry: s.industry, here: hereIds.indexOf(s.id) >= 0,
    clarity: strengthOf(s.self), type: typeOf(tendencyScores(s.self), false).name
  }));
  const key = r => undecided ? r.clarity : r.score;
  const sorted = all.slice().sort((a, b) => (Number(b.here) - Number(a.here)) || (key(b) - key(a)) || (a.index - b.index));
  const used = [];
  const examples = sorted.slice(0, EXAMPLES).map(r => Object.assign(r, { label: closeness(r.score) }, questionFor(r, undecided, used)));
  all.forEach(r => { if (!r.label) r.label = closeness(r.score); });

function stageGroup(stage) {
  return stage === 'done' ? 'done' : (stage === 'intern' || stage === 'selection') ? 'active' : 'early';
}
/* 次の一歩（2〜3個）：時期・会社の比べ方・確かめること */
function nextSteps(phase, stage, draft, insights, undecided, v) {
  const g = stageGroup(stage);
  const P = PHASES[phase];
  const steps = [{ title: g === 'done' ? '内定が決まった人へ' : P.label, text: fill(g === 'done' ? DONE_STEP : P[g]) }];
  if (undecided || draft.length < 2) steps.push({ title: 'いろいろな会社を見る', text: fill(EXPLORE_STEP) });
  else steps.push({ title: '会社をものさしで比べる', text: fill(COMPARE_STEP, { a: draft[0].label, b: draft[1].label }) });
  if (g !== 'done') {
    if (insights.length) steps.push({ title: '確かめること：' + insights[0].title, text: insights[0].check });
    else {
      const id = ITEM_IDS.find(x => val(v, x) === 0);
      if (id) steps.push({ title: 'これから確かめること：' + ITEM[id].name, text: ITEM[id].check });
    }
  }
  return steps;
}
/* センターやサポーターに聞いてみるとよいこと（1〜3個） */
function centerQuestions(r, themes) {
  const qs = [];
  (themes || []).slice(0, 2).forEach(k => { const t = themeOf(k); if (t) qs.push(t.question); });
  if (r.undecided) qs.push(UNDECIDED.ask);
  else if (r.insights.length) qs.push('診断で「' + r.insights[0].title + '」と出ました。この視点で会社を探すなら、何から調べるとよいですか？');
  else if (r.draft.length) qs.push(ITEM[r.draft[0].id].ask);
  if (r.examples.length) qs.push(r.examples[0].q);
  return qs.filter((q, i) => q && qs.indexOf(q) === i).slice(0, 3);
}
/* 診断のすべての結果（画面・メール・サーバーで共通）
   input: { grad, stage, axes:{14問}, values:[2つ], conds, fields, forms, themes } */
function analyze(input, now, opts) {
  opts = opts || {};
  const v = cleanAxes(input.axes) || {};
  const values = cleanList(input.values, VALUE_IDS, 2) || [];
  const conds = cleanList(input.conds, COND_IDS, 2) || [];
  const fields = cleanList(input.fields, FIELD_IDS, 3) || [];
  const forms = cleanList(input.forms, FORM_IDS, FORM_IDS.length) || [];
  const themes = cleanThemes(input.themes) || [];
  const strength = strengthOf(v);
  const undecided = strength <= UNDECIDED_MAX;
  const ts = tendencyScores(v);
  const type = typeOf(ts, undecided);
  const draft = draftOf(v, ts, undecided);
  const insights = insightsOf(v, ts, values, undecided);
  const phase = phaseOf(input.grad, now);
  const ex = pickExamples(v, values, fields, opts.here, undecided);
  const r = {
    v, strength, undecided, tendencies: ts, type, draft, insights,
    values: values.map(id => VALUES.find(x => x.id === id)),
    condLabels: conds.map(id => labelOf(CONDS, id)), fieldLabels: fields.map(id => labelOf(FIELDS, id)), formLabels: forms.map(id => labelOf(ABROAD_FORMS, id)),
    tags: tagsOf(v), industries: rankIndustries(v).slice(0, 3),
    examples: ex.examples, everyone: ex.everyone,
    phase, gradLabel: gradLabel(input.grad), stageLabel: stageLabel(input.stage),
    themes, themeLabels: themes.map(k => themeOf(k).label),
    map: mapPosOf(ts)
  };
  r.steps = nextSteps(phase, input.stage, draft, insights, undecided, v);
  r.questions = centerQuestions(r, themes);
  return r;
}
function sampleInput(now) {

    values: ['growth', 'contribute'], conds: ['train'], fields: ['f9'], forms: ['trip', 'mate'] };
}

/* ---------- 12. メール本文（「就活の軸シート」） ----------

function tendencyLine(t) { return t.name + '：' + (t.side ? t.side.label + '（' + t.level + '）' : t.level); }
function buildEmail(r) {

  ].filter(Boolean);

      '<br>' + muted(e(a.probe)) + '<br>そう思うようになったきっかけ：' + blank + '</div>').join(''));
    p.push('<p style="background:#f4f6f8;padding:10px 12px;border-radius:8px">例文：私が企業選びで大事にしているのは、' + e(r.draft[0].text) + 'です。そう考えるようになったのは、' + blank + 'がきっかけです。</p>');
  } else {

  }
  if (r.values.length) p.push('<p>やりがいを感じやすいこと：<b>' + r.values.map(x => e(x.label)).join('・') + '</b><br>' + muted(e(r.values[0].axis)) + '</p>');
  p.push(H('答えから見えた傾向'));
  p.push(UL(r.tendencies.map(t => e(tendencyLine(t)))));
  if (r.insights.length) {
    p.push(H('答えの組み合わせから見えること'));
    p.push(UL(r.insights.map(x => '<b>' + e(x.title) + '</b><br>' + e(x.text) + '<br>' + muted('確かめ方：' + e(x.check)))));
  }
  p.push(H('会社を見るときのものさし'));
  p.push('<p>' + (r.tags.length ? r.tags.map(x => e(x.label)).join('／') : 'まだ方向が固まっていない観点が多くあります。') + '</p>');
  if (extras.length) p.push('<p>' + extras.map(x => muted(e(x[0]) + '：') + e(x[1])).join('<br>') + '</p>');
  p.push(H('考え方が近いサポーター'));
  p.push(UL(r.examples.map(t => '<b>' + e(t.name) + '</b>（' + e(t.industry) + '）' +
    (t.s.note ? '<br>' + e(t.s.note) : '') + '<br>' + muted('聞いてみたいこと：' + e(t.q)))));
  p.push(H('次の一歩'));
  p.push('<ol style="margin:0 0 10px;padding-left:22px">' + r.steps.map(s => '<li style="margin:0 0 8px"><b>' + e(s.title) + '</b><br>' + e(s.text) + '</li>').join('') + '</ol>');
  p.push(H(CONFIG.centerName + 'で、軸を完成させよう'));
  p.push('<p>' + e(fill(CENTER_PITCH)) + '</p>');
  p.push(UL(r.questions.map(e)));
  if (booking) p.push('<p style="margin:14px 0"><a href="' + e(booking) + '" style="display:inline-block;background:#0f7a4a;color:#ffffff;text-decoration:none;font-weight:bold;padding:10px 18px;border-radius:8px">' + e(CONFIG.centerName) + 'の個別面談を予約する</a></p>');
  p.push('<p style="margin:24px 0 0;padding-top:12px;border-top:1px solid #dfe4ea;color:#566275;font-size:12px">' +
    'この診断は、今のあなたの考えのスナップショットです。経験を重ねると変わっていくのが自然です。' + e(IMAGE_NOTE) + '<br>' +
    'このメールは「' + e(CONFIG.appTitle) + '」で結果の受け取りを希望した方にお送りしています。心当たりがない場合は、お手数ですが破棄してください（学籍番号の入力ミスの可能性があります）。</p>');
  const html = '<div style="font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',\'Hiragino Kaku Gothic ProN\',Meiryo,sans-serif;font-size:15px;line-height:1.75;color:#0d1726;max-width:600px">' + p.join('') + '</div>';

  const T = [];
  T.push('「' + CONFIG.appTitle + '」の結果（就活の軸シート）をお送りします。', '');
  T.push('■ あなたのタイプ：' + r.type.name + (r.type.poles.length ? '（' + r.type.poles.map(x => x.label).join(' × ') + '）' : ''));
  T.push('', '■ 就活の軸（下書き）');
  if (r.draft.length) {
    r.draft.forEach((a, k) => { T.push((k + 1) + '. ' + a.text + '（' + a.level + '）', '   ' + a.probe, '   そう思うようになったきっかけ：＿＿＿＿＿＿'); });
    T.push('例文：私が企業選びで大事にしているのは、' + r.draft[0].text + 'です。そう考えるようになったのは、＿＿＿＿がきっかけです。');
  } else T.push(r.undecided ? UNDECIDED.desc : BALANCED.desc);
  if (r.values.length) T.push('やりがいを感じやすいこと：' + r.values.map(x => x.label).join('・'));
  T.push('', '■ 答えから見えた傾向');
  r.tendencies.forEach(t => T.push('・' + tendencyLine(t)));
  if (r.insights.length) {
    T.push('', '■ 答えの組み合わせから見えること');
    r.insights.forEach(x => T.push('・' + x.title, '  ' + x.text, '  確かめ方：' + x.check));
  }
  T.push('', '■ 会社を見るときのものさし', r.tags.length ? r.tags.map(x => x.label).join('／') : 'まだ方向が固まっていない観点が多くあります。');
  extras.forEach(x => T.push(x[0] + '：' + x[1]));
  T.push('', '■ 考え方が近いサポーター');
  r.examples.forEach(t => { T.push('・' + t.name + '（' + t.industry + '）' + (t.s.note ? '：' + t.s.note : ''), '  聞いてみたいこと：' + t.q); });
  T.push('', '■ 次の一歩');
  r.steps.forEach((s, k) => T.push((k + 1) + '. ' + s.title + '：' + s.text));
  T.push('', '■ ' + CONFIG.centerName + 'で、軸を完成させよう', fill(CENTER_PITCH));
  r.questions.forEach(q => T.push('・' + q));
  if (booking) T.push('個別面談の予約：' + booking);
  T.push('', IMAGE_NOTE, '心当たりがない場合は、このメールを破棄してください（学籍番号の入力ミスの可能性があります）。');
  return { subject, html, text: T.join('\n') };
}

/* ---------- 13. 送信の受け付け（サーバーで実行。画面のデモ版でも同じ処理を使う） ---------- */
const RECORD_HEADERS = ['受付日時', 'イベント', '学籍番号', '卒業予定', '就活の状況', '相談したいこと', '診断タイプ', 'メール'];
function sheetSafe(v) { const s = String(v == null ? '' : v); return /^[=+\-@\t\r]/.test(s) ? "'" + s : s; }
function validateSubmission(p, now) {
  if (!p || typeof p !== 'object') return { ok: false, errors: ['PAYLOAD'] };
  const errors = [];
  const studentId = normalizeStudentId(p.studentId);
  if (!isValidStudentId(studentId)) errors.push('STUDENT_ID');
  if (p.consent !== true) errors.push('CONSENT');
  if (!isValidGradKey(p.grad, now)) errors.push('GRAD');
  if (!STAGES.some(s => s.key === p.stage)) errors.push('STAGE');
  const axes = cleanAxes(p.axes);
  if (!axes) errors.push('ANSWERS');
  const values = cleanList(p.values, VALUE_IDS, 2);
  if (!values || values.length !== 2) errors.push('VALUES');
  const conds = cleanList(p.conds, COND_IDS, 2);
  if (!conds) errors.push('CONDS');
  const fields = cleanList(p.fields, FIELD_IDS, 3);
  if (!fields) errors.push('FIELDS');
  const forms = cleanList(p.forms, FORM_IDS, FORM_IDS.length);
  if (!forms) errors.push('FORMS');
  const themes = cleanThemes(p.themes);
  if (themes === null) errors.push('THEMES');
  if (errors.length) return { ok: false, errors };
  return { ok: true, clean: { studentId, grad: String(p.grad), stage: p.stage, axes, values, conds, fields, forms, themes, event: sanitizeEvent(p.event), here: sanitizeHere(p.here) } };
}
function buildRecordRow(c, r, now, mailStatus) {
  return [now, sheetSafe(c.event), sheetSafe(c.studentId), sheetSafe(r.gradLabel), sheetSafe(r.stageLabel),
    sheetSafe(r.themeLabels.join('・')), sheetSafe(r.type.name), sheetSafe(mailStatus)];
}
/* deps: { now, withLock(fn), cacheGet(k), cachePut(k, v, sec), mailQuota(), sendMail(m), appendRow(row) } */
function processSubmission(p, deps) {
  if (CONFIG.receive !== 'mail') return { ok: false, code: 'CLOSED' };   // 受け取り欄を出さない設定では、記録もメールもしない
  const now = deps.now;
  const v = validateSubmission(p, now);
  if (!v.ok) return { ok: false, code: 'INVALID', fields: v.errors };
  const c = v.clean;
  const key = 'sent:' + c.studentId;
  const allowed = deps.withLock(() => {
    const n = parseInt(deps.cacheGet(key) || '0', 10) || 0;
    if (n >= CONFIG.maxSendsPerIdPer6h) return false;
    deps.cachePut(key, String(n + 1), 21600);
    return true;
  });
  if (!allowed) return { ok: false, code: 'RATE' };
  const r = analyze(c, now, { here: c.here });
  const to = emailFor(c.studentId);
  let mailed = false, code = 'OK';
  try {
    if (deps.mailQuota() > 0) {
      const m = buildEmail(r);
      deps.sendMail({ to, subject: m.subject, html: m.html, text: m.text, senderName: CONFIG.senderName });
      mailed = true;
    } else {
      code = 'QUOTA';
    }
  } catch (err) {
    code = 'MAIL_ERROR';
  }
  deps.appendRow(buildRecordRow(c, r, now, mailed ? '送信済み' : '未送信（' + code + '）'));
  return { ok: true, mailed, code, to };
}

/* ---------- 14. サポーター登録データ ---------- */
function validateSupporter(s) {
  const p = [];
  const str = x => typeof x === 'string';
  const step = x => typeof x === 'number' && STEP_VALUES.indexOf(x) >= 0;
  if (!s || typeof s !== 'object') return ['データがありません'];
  if (!str(s.id) || !s.id) p.push('id');
  if (!str(s.name)) p.push('name');
  if (!str(s.industry) || !s.industry) p.push('industry');
  if (!str(s.note)) p.push('note');
  if (!str(s.gapNote)) p.push('gapNote');
  if (!Array.isArray(s.themes) || !s.themes.every(t => themeOf(t))) p.push('themes');
  if (!cleanList(s.fields, FIELD_IDS, 3)) p.push('fields');
  const vs = cleanList(s.values, VALUE_IDS, 2);
  if (!vs || vs.length !== 2) p.push('values');
  if (!s.self || ITEM_IDS.some(id => !step(s.self[id]))) p.push('self');
  if (!s.company || typeof s.company !== 'object' || Object.keys(s.company).some(id => COMPANY_IDS.indexOf(id) < 0 || !step(s.company[id]))) p.push('company');
  if (s.major !== undefined && !str(s.major)) p.push('major');
  if (s.past !== undefined && !str(s.past)) p.push('past');
  if (s.card !== undefined && !isValidCard(s.card)) p.push('card');
  return p;
}
/* 回答カードの答え（軸ごとに pos 側を選んだ数 0〜3）。すべての軸がそろっていること */
function isValidCard(c) {
  return !!c && typeof c === 'object' && !Array.isArray(c) && Object.keys(c).every(k => CARD_AXIS_IDS.indexOf(k) >= 0) &&
    CARD_AXIS_IDS.every(k => Number.isInteger(c[k]) && c[k] >= 0 && c[k] <= CARD_N);
}
function supporterSnippet(f, v, values, fields) {
  const q = x => JSON.stringify(String(x == null ? '' : x));
  const arr = a => '[' + a.map(q).join(', ') + ']';
  const obj = (o, ids) => '{ ' + ids.map(id => id + ': ' + Number(val(o, id))).join(', ') + ' }';
  const card = f.card || {};
  /* 1行にまとめる（スプレッドシートの1つのセルにそのまま貼れるように） */
  return ("{ id: 'S?', name: " + q(String(f.name).trim()) + ', industry: ' + q(String(f.industry).trim()) + ', note: ' + q(String(f.note).trim()) + ',\n' +
    '  themes: ' + arr(f.themes) + ', fields: ' + arr(fields) + ', values: ' + arr(values) + ',\n' +
    '  self: ' + obj(v, ITEM_IDS) + ',\n' +
    '  company: ' + obj(f.company, COMPANY_IDS) + ', gapNote: ' + q(String(f.gapNote).trim()) + ',\n' +
    '  major: ' + q(String(f.major || '').trim()) + ', past: ' + q(String(f.past || '').trim()) + ', card: { ' + CARD_AXIS_IDS.map(id => id + ': ' + cardCount(card[id])).join(', ') + ' } },').replace(/\n\s*/g, ' ');
}
/* カードの答え（その軸の3問で pos 側を選んだかどうかの配列）→ pos 側の数 */
function cardCount(answers) { return Array.isArray(answers) ? answers.filter(x => x === 'pos').length : 0; }

/* ---------- 15. サポーターの色（会場マップの名前アイコン・サポーター紹介・結果画面で共通） ----------
   アイコンは角の丸い四角に下の名前（ひらがな）。SUPPORTERS の並び順で色を割り当てる。
   白黒で印刷しても名前で見分けられる。色は白い文字が読める濃さ（?test=1 で検査） */
const MARK_COLORS = ['#1d4ed8', '#b91c1c', '#15803d', '#7e22ce', '#c2410c', '#0f766e', '#be185d', '#a16207', '#334155'];   // 藍・赤・緑・紫・橙・青緑・紅・山吹・墨（白い文字が読める濃さ）
function markOf(s) {
  const i = Math.max(0, SUPPORTERS.indexOf(s));
  return { color: MARK_COLORS[i % MARK_COLORS.length] };
}
/* マップ横のサポーター紹介の並び：区画の順（左上→右上→左下→右下）、区画の中は名前の50音順 */
function supporterOrder(plan) {
  const order = mapQuadrants(plan.map).map(q => q.key);
  return plan.seniors.slice().sort((a, b) => (order.indexOf(a.quad.key) - order.indexOf(b.quad.key)) || displayName(a.s).localeCompare(displayName(b.s), 'ja'));
}
/* あるマスから近い順のサポーター（同じ距離なら50音順） */
function nearestSupporters(plan, col, row) {
  const d = x => (x.col - col) * (x.col - col) + (x.row - row) * (x.row - row);
  return plan.seniors.slice().sort((a, b) => (d(a) - d(b)) || displayName(a.s).localeCompare(displayName(b.s), 'ja'));
}

/* ---------- 16. 会場の2軸マップ（通りがかりの立ちイベントの入口） ----------
   学生はQRを読み取り、スマホで二択6問（ヨコ3問・タテ3問）に答える。画面に出たマス（ヨコ○・タテ○）にシールを貼る（10/14決定）。
   スマホがない・使いたくない人には、同じ6問の紙の「回答カード」（予備）を渡す。紙では足し算はせず、
   ヨコは「右の文に○をつけた数」、タテは「上の文に○をつけた数」を数えるだけ（同じ軸の問いは同じ側を同じ位置に印刷する）。
   スマホも紙も同じ問い・同じ数え方なので、どちらで答えても同じマスになる。
   1つの軸は3問（奇数）なので、真ん中（どちらとも）にならず、必ず4つの区画のどれかに入る。
   スマホの診断の傾向（TENDENCIES）と同じ向きの軸なので、スマホの結果でも「マップでいうとどこか」を出せる。
   CARD_AXES : カードとマップに使える軸（3つ）。neg / pos は、つながる傾向（tendency）の向きと同じ。
               questions は大学生活の場面の二択3問。就活を意識していない学生でも答えられるようにする。
               両側とも前向きな言い方・同じくらいの長さにそろえる（?test=1 で検査）
   MAP       : いま使う2軸。x はヨコ（right の側を右に置く）、y はタテ（up の側を上に置く）。
               サポーターの回答が集まったら、運営画面（会場の印刷物）の「2軸の組み合わせ」で、
               サポーターが4つの区画にいちばん散らばる組み合わせを確かめて書き換える
   QUADRANTS : 区画の名前・ひとこと・サポーターが話しかけるときのきっかけ（2軸の組み合わせ3通り × 4区画）。
               どの区画も前向きな名前にする（どこに貼っても「当たり」）
   STICKERS  : シールの色（卒業年度別）。終わったあと、色ごとに数えると卒業年度×区画の集計になる
   w, h      : 模造紙の大きさ（mm。四六判の模造紙を横向きに使う） */
const CARD_N = 3;
const CARD_AXES = {
  move: { tendency: 'move', name: '進み方', neg: '積み上げる', pos: '切り拓く',
    questions: [
      { neg: 'サークルやバイトでは、今あるやり方を磨いていくのが好き', pos: 'サークルやバイトでは、新しいやり方を試してみるのが好き' },
      { neg: '一つのことを長く続けて、上達していくのがうれしい', pos: '初めてのことに挑戦して、できるようになるのがうれしい' },
      { neg: 'ご飯は、お気に入りの店の定番をじっくり味わいたい', pos: 'ご飯は、まだ行ったことのない店を開拓したい' }
    ] },
  reach: { tendency: 'reach', name: '届け方', neg: 'たくさんの人に', pos: '目の前の人に',
    questions: [
      { neg: '文化祭なら、たくさんの人が集まる企画を動かしたい', pos: '文化祭なら、来た人と一人ずつ話せる企画をやりたい' },
      { neg: 'よいと思ったものは、SNSなどで多くの人に広めたい', pos: 'よいと思ったものは、身近な人に直接すすめたい' },
      { neg: '「たくさんの人の役に立った」と聞くとうれしい', pos: '「あなたのおかげ」と直接言われるとうれしい' }
    ] },
  style: { tendency: 'style', name: '伸ばし方', neg: 'みんなで広く', pos: 'とことん深く',
    questions: [
      { neg: 'グループ課題では、みんなの意見をまとめる役が合っている', pos: 'グループ課題では、自分の担当を深く調べる役が合っている' },
      { neg: '授業は、いろいろな分野を広く取ってみたい', pos: '授業は、一つの分野をとことん深めたい' },
      { neg: '何かを決めるときは、みんなで話し合って決めたい', pos: '何かを決めるときは、自分でよく考えて決めたい' }
    ] }
};
const CARD_AXIS_IDS = Object.keys(CARD_AXES);
const MAP = {
  x: { axis: 'move', right: 'pos' },    // ヨコ：左が「積み上げる」、右が「切り拓く」
  y: { axis: 'reach', up: 'neg' },      // タテ：上が「たくさんの人に」、下が「目の前の人に」（10/14：登録7名で「伸ばし方」だと空の区画が出たため切り替え）
  title: 'シールを貼って、サポーターと話そう',
  lead: 'スマホで6問に答えて、画面に出たマスにシールを1枚。話のきっかけのための、ゆるい診断です。',
  w: 1091, h: 788
};
/* シールの色は卒業予定の年度（10/14夜：学年から変更。留学などで卒業が延びる人も、予定の年度で選べる）。
   いまの年度に卒業する学年（2026年度なら27卒）から順に4つ。丸シールは市販の4色で、卒業が近い順に 黄→緑→青→赤 */
function stickerSet(now) {
  const b = currentBaseYear(now || new Date()) % 100;
  return [
    { label: b + '卒', name: '黄', color: '#f2c230' },
    { label: (b + 1) + '卒', name: '緑', color: '#2fa66a' },
    { label: (b + 2) + '卒', name: '青', color: '#3e7bfa' },
    { label: (b + 3) + '卒以降', name: '赤', color: '#e5484d' }
  ];
}
const STICKERS = stickerSet();
const QUADRANTS = {
  'move:pos|reach:neg': { name: '時代をひらく開拓者', desc: '新しいやり方で、たくさんの人に届く変化を起こしたい', talk: '最近「これは新しい」と思ったサービスや出来事はある？' },

function otherSide(s) { return s === 'pos' ? 'neg' : 'pos'; }
function quadrantKey(a, sa, b, sb) {
  const p = [[a, sa], [b, sb]].sort((u, v) => CARD_AXIS_IDS.indexOf(u[0]) - CARD_AXIS_IDS.indexOf(v[0]));

/* 区画：ヨコとタテの側から。corner は模造紙での位置（TL・TR・BL・BR。印刷の色分けに使う） */
function quadrantOf(xSide, ySide, map) {
  map = map || MAP;
  const key = quadrantKey(map.x.axis, xSide, map.y.axis, ySide);
  const q = QUADRANTS[key] || { name: '', desc: '', talk: '' };
  return { key, xSide, ySide, corner: (ySide === map.y.up ? 'T' : 'B') + (xSide === map.x.right ? 'R' : 'L'), name: q.name, desc: q.desc, talk: q.talk };

/* 4つの区画を、左上・右上・左下・右下の順に */
function mapQuadrants(map) {
  map = map || MAP;
  const r = map.x.right, u = map.y.up;
  return [[otherSide(r), u], [r, u], [otherSide(r), otherSide(u)], [r, otherSide(u)]].map(p => quadrantOf(p[0], p[1], map));
}
/* カードの答え（軸ごとの pos の数 0〜3）→ マス。col は左から、row は下から（0〜3）。3問なので必ずどちらかの側に決まる */
function cellOf(counts, map) {
  map = map || MAP;
  const nx = counts[map.x.axis], ny = counts[map.y.axis];
  const col = map.x.right === 'pos' ? nx : CARD_N - nx;
  const row = map.y.up === 'pos' ? ny : CARD_N - ny;

/* サポーターのカードの答え。登録がなければ14問の傾向から近い値を出す（derived: true。運営画面で知らせる） */
function supporterCard(s) {
  if (isValidCard(s.card)) return { counts: Object.assign({}, s.card), derived: false };
  const ts = tendencyScores(s.self), counts = {};
  CARD_AXIS_IDS.forEach(id => {

  return { counts, derived: true };

/* サポーターのマップ上の位置（名前を刷るマス）と、区画ごとの顔ぶれ */
function mapPlanFor(map) {

  const seniors = SUPPORTERS.map(s => { const c = supporterCard(s); return Object.assign({ s, counts: c.counts, derived: c.derived }, cellOf(c.counts, map)); });
  const quads = mapQuadrants(map).map(q => Object.assign({}, q, { members: seniors.filter(x => x.quad.key === q.key).map(x => x.s) }));
  const sizes = quads.map(q => q.members.length);

function mapPlan() { if (!mapCache) mapCache = mapPlanFor(MAP); return mapCache; }
function resetMapCache() { mapCache = null; }
function seniorOnMap(s) { return mapPlan().seniors.find(x => x.s === s) || null; }

  for (let i = 0; i < CARD_AXIS_IDS.length; i++) {
    for (let j = i + 1; j < CARD_AXIS_IDS.length; j++) {

      const current = [MAP.x.axis, MAP.y.axis].sort().join() === [a, b].sort().join();
      const p = mapPlanFor(current ? MAP : { x: { axis: a, right: 'pos' }, y: { axis: b, up: 'neg' } });
      const sizes = p.quads.map(q => q.members.length), mean = SUPPORTERS.length / 4;

  const best = out.slice().sort((u, v) => (v.min - u.min) || (u.empty - v.empty) || (u.sd - v.sd) || (Number(v.current) - Number(u.current)))[0];
  out.forEach(x => { x.best = x === best; });

}
/* スマホの14問から見た、マップ上の位置（スマホの結果とメールに出す）。
   傾向（-1〜1）を、カードの○の数と同じ目盛り（片方の端のマスの中心〜反対の端のマスの中心）に置く。x は左から、y は下から（0〜4）。
   傾向がほぼ0なら「境目」として、どちらかに決めつけない */
const MAP_EDGE = 0.1;

  map = map || MAP;
  const m = id => { const t = ts.find(x => x.id === CARD_AXES[id].tendency); return t ? t.m : 0; };
  const mx = m(map.x.axis), my = m(map.y.axis);

  const x = map.x.right === 'pos' ? u(mx) : CARD_N + 1 - u(mx);
  const y = map.y.up === 'pos' ? u(my) : CARD_N + 1 - u(my);
  const side = v => Math.abs(v) < MAP_EDGE ? null : v > 0 ? 'pos' : 'neg';
  const xs = side(mx), ys = side(my);
  const quads = [];
  (xs ? [xs] : ['neg', 'pos']).forEach(a => (ys ? [ys] : ['neg', 'pos']).forEach(b => quads.push(quadrantOf(a, b, map))));

    : quads.length === 2 ? '「' + quads[0].name + '」と「' + quads[1].name + '」の境目'
    : 'マップの真ん中あたり（4つの区画の境目）';
  return { x, y, quads, label };
}

    document.getElementById('fresh').onclick = () => { clearProgress(); resetState(); screenIntro(); };
  }
  document.querySelectorAll('[data-go]').forEach(b => {
    b.onclick = () => {
      const go = b.dataset.go;
      Object.assign(params, { profile: go === 'profile', admin: go === 'admin', poster: go === 'poster', test: go === 'test', quick: go === 'quick' });
      resetState();
      if (go === 'test') runSelfTest(); else if (go === 'admin') screenAdmin(); else if (go === 'poster') screenPoster(); else if (go === 'quick') screenQuick(); else screenIntro();
    };
  });
}
/* デモ版（Googleのサーバーを通さずに開いたとき）の学生用のはじめの画面にだけ、運営向けの入口を出す */
function showDemoMenu() { return !IS_GAS && !LIVE && !params.profile && !params.admin && !params.poster && !params.event && !params.quick; }

/* ------------------------------ 質問 ------------------------------ */
function screenStep() {
  const L = steps();
  const step = L[state.i];
  const progress = Math.round(state.i / L.length * 100);
  const sec = sectionOf(step);
  let body;
  if (step === 'grad' || step === 'stage') {
    const opts = step === 'grad' ? gradOptions(new Date()) : STAGES;
    const cur = step === 'grad' ? state.grad : state.stage;
    const q = step === 'grad' ? '何年卒として就職する予定ですか？' : '今の就活の状況に、いちばん近いものは？';
    body = `<p class="qtext">${q}</p>
      <div id="choices">${opts.map((o, k) => `
        <button class="btn ${cur === o.key ? 'sel' : ''}" data-k="${k}">
          <span class="key">${k + 1}</span><span>${esc(o.label)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</span>
        </button>`).join('')}</div>`;
  } else if (step.indexOf('q:') === 0) {
    const it = ITEM[step.slice(2)];
    const A = it.flip ? it.q.hi : it.q.lo, B = it.flip ? it.q.lo : it.q.hi;
    const cur = state.axes[it.id];
    const shown = typeof cur === 'number' ? ((it.flip ? -cur : cur) || 0) : null;
    body = `<p class="qtext">どちらの考えに近いですか？</p>
      <div class="stmt sa"><span class="tag">A</span><span>${esc(A)}</span></div>
      <div class="scale" role="radiogroup" aria-label="AとBのどちらに近いか">
        ${DISPLAY_VALUES.map((d, k) => `<button class="dot d${k} ${shown === d ? 'sel' : ''}" data-d="${d}" role="radio" aria-checked="${shown === d}" aria-label="${SCALE_ARIA[k]}"></button>`).join('')}
      </div>
      <div class="scale-labels"><span class="la">Aに近い</span><span>どちらとも</span><span class="lb">Bに近い</span></div>
      <div class="stmt sb"><span class="tag">B</span><span>${esc(B)}</span></div>`;
  } else {
    const P = PICKS[step], sel = state[step];
    body = `<p class="qtext">${esc(P.q)}</p>
      <p class="count" id="pcount"></p>
      <div id="picks">${P.list().map(o => `
        <button class="btn" data-key="${esc(o.key)}" aria-pressed="false">
          <span class="key">＋</span><span>${esc(o.label)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</span>
        </button>`).join('')}</div>
      <button class="primary" id="pnext" style="margin-top:6px">次へ</button>`;
  }
  render(`
    <div class="card">
      <div class="progress"><i style="width:${progress}%"></i></div>
      <div class="qmeta"><span><b>${esc(sec.name)}</b>${sec.n ? `　${sec.k} / ${sec.n}` : ''}</span><span>${state.i + 1} / ${L.length}</span></div>
      ${body}
      <div class="row" style="margin-top:18px"><button class="ghost" id="back">← 戻る</button></div>
    </div>`);
  document.getElementById('back').onclick = () => { if (state.i === 0) screenIntro(); else { state.i--; screenStep(); } };
  if (step === 'grad' || step === 'stage') {
    const opts = step === 'grad' ? gradOptions(new Date()) : STAGES;
    document.querySelectorAll('#choices .btn').forEach(b => {
      b.onclick = () => {
        const o = opts[Number(b.dataset.k)];
        if (step === 'grad') state.grad = o.key; else state.stage = o.key;
        advance(b);
      };
    });
  } else if (step.indexOf('q:') === 0) {
    const it = ITEM[step.slice(2)];
    document.querySelectorAll('.scale .dot').forEach(b => {
      b.onclick = () => { const d = Number(b.dataset.d); state.axes[it.id] = (it.flip ? -d : d) || 0; advance(b); };
    });
  } else {
    const P = PICKS[step], sel = state[step];
    const isLast = state.i === L.length - 1;
    const refresh = () => {
      const n = sel.length, c = document.getElementById('pcount');
      c.textContent = P.ordered ? (n < P.min ? `あと ${P.min - n} つ選んでください` : '選び直すときは、選んだものをもう一度押してください')
        : (n >= P.max ? `${P.max}つ選びました（変えるときは、選んだものをもう一度押してください）` : P.note);
      c.className = 'count' + (n >= P.max && !P.ordered ? ' full' : '');
      document.querySelectorAll('#picks .btn').forEach(b => {
        const at = sel.indexOf(b.dataset.key);
        b.classList.toggle('sel', at >= 0);
        b.setAttribute('aria-pressed', String(at >= 0));
        b.querySelector('.key').textContent = at < 0 ? '＋' : P.ordered ? String(at + 1) : '✓';
      });
      const nx = document.getElementById('pnext');
      nx.disabled = n < P.min;
      nx.textContent = isLast ? (params.profile ? '登録フォームへ' : '結果を見る') : (n || P.min ? '次へ' : 'とくにないので次へ');
      nx.className = 'primary' + (isLast ? ' go' : '');
    };
    document.querySelectorAll('#picks .btn').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.key, at = sel.indexOf(k);
        if (at >= 0) sel.splice(at, 1);
        else if (sel.length < P.max) sel.push(k);
        refresh();
      };
    });
    document.getElementById('pnext').onclick = () => { if (sel.length >= P.min) next(); };
    refresh();
  }
}
function next() {
  state.i++;
  if (state.i >= steps().length) (params.profile ? screenProfile() : screenResult());
  else { saveProgress(false); screenStep(); }
}
function advance(el) {
  document.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  setTimeout(next, 160);
}
document.addEventListener('keydown', e => {
  if (document.querySelector('.overlay')) return;
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const n = parseInt(e.key, 10);
  if (!(n >= 1 && n <= 9)) return;
  const dots = document.querySelectorAll('.scale .dot');
  if (dots.length && n <= 5) { dots[n - 1].click(); return; }
  const btns = document.querySelectorAll('#choices .btn, #picks .btn');
  if (btns.length >= n) btns[n - 1].click();
});

/* ------------------------------ 会場のスマホ6問（?quick=1。会場のQRの先） ------------------------------
   卒業予定の年度（シールの色）→ マップの2軸の二択6問 → シールを貼るマス・区画・近くのサポーター。
   紙の回答カード（予備）と同じ問い・同じ数え方（右・上の側を選んだ数）なので、どちらで答えても同じマスになる。
   答えは送信も保存もしない（この画面の中だけで計算する）。 */
function quickQuestions() {
  const R = cardRows();
  return R.x.map((q, k) => ({ axis: MAP.x.axis, k, a: q.left, b: q.right, aSide: otherSide(MAP.x.right), bSide: MAP.x.right }))
    .concat(R.y.map((q, k) => ({ axis: MAP.y.axis, k, a: q.top, b: q.bottom, aSide: MAP.y.up, bSide: otherSide(MAP.y.up) })));
}
/* 6問の答え（各問で選んだ側 'pos' / 'neg'）→ マス */
function quickCell(ans) {
  const counts = {};
  CARD_AXIS_IDS.forEach(id => { counts[id] = 0; });
  quickQuestions().forEach((q, i) => { if (ans[i] === 'pos') counts[q.axis]++; });
  return cellOf(counts);
}
function quickAdvance(el) {
  document.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  setTimeout(() => { state.quick.i++; screenQuick(); }, 160);
}
function screenQuick() {
  const Q = state.quick, qs = quickQuestions(), n = qs.length;
  if (Q.i > n) { screenQuickResult(); return; }
  if (Q.i === 0) {
    render(`
      <div class="card hero">
        <p class="eyebrow">${esc(CONFIG.centerName)} × 就活サポーター${CONFIG.eventTitle ? '　｜　' + esc(CONFIG.eventTitle) : ''}</p>
        <h1>${n}問・30秒で、シールを貼るマスがわかる</h1>
        <div class="rule"></div>
        <p class="lead">直感で、近いほうを選ぶだけ。正解はありません。名前や学籍番号は聞かず、答えは送信もしません。</p>
      </div>
      <div class="card">
        <p class="qtext">まず、何年卒の予定ですか？（シールの色が決まります）</p>
        <p class="note" style="margin-top:-6px">留学などで卒業が延びる人は、いま予定している年度で選んでください。</p>
        <div id="choices">${STICKERS.map((s, k) => `
          <button class="btn ${Q.grade === k ? 'sel' : ''}" data-k="${k}"><span class="key">${k + 1}</span><span><span class="stk" style="background:${s.color}"></span>${esc(s.label)}<small>${esc(s.name)}のシール</small></span></button>`).join('')}</div>
      </div>`);
    document.querySelectorAll('#choices .btn').forEach(b => { b.onclick = () => { Q.grade = Number(b.dataset.k); quickAdvance(b); }; });
    return;
  }
  const q = qs[Q.i - 1];
  render(`
    <div class="card">
      <div class="progress"><i style="width:${Math.round((Q.i - 1) / n * 100)}%"></i></div>
      <div class="qmeta"><span><b>どちらが近い？</b></span><span>${Q.i} / ${n}</span></div>
      <p class="qtext">直感で、近いほうを選んでください</p>
      <div id="choices">${[['a', q.aSide], ['b', q.bSide]].map(([w, side], k) => `
        <button class="btn ${Q.ans[Q.i - 1] === side ? 'sel' : ''}" data-side="${side}"><span class="key">${k + 1}</span><span>${esc(q[w])}</span></button>`).join('')}</div>
      <div class="row" style="margin-top:18px"><button class="ghost" id="back">← 戻る</button></div>
    </div>`);
  document.getElementById('back').onclick = () => { Q.i--; screenQuick(); };
  document.querySelectorAll('#choices .btn').forEach(b => { b.onclick = () => { Q.ans[Q.i - 1] = b.dataset.side; quickAdvance(b); }; });
}
function screenQuickResult() {
  const Q = state.quick, cell = quickCell(Q.ans), plan = mapPlan(), st = STICKERS[Q.grade] || null;
  const near = nearestSupporters(plan, cell.col, cell.row).filter(x => !x.s.tentative).slice(0, EXAMPLES);
  const same = plan.seniors.filter(x => x.quad.key === cell.quad.key);
  const where = { map: { x: cell.col + 0.5, y: cell.row + 0.5, label: '「' + cell.quad.name + '」の区画（ヨコ' + cell.col + '・タテ' + cell.row + '）' } };
  const short = k => { const t = themeOf(k); return t ? (t.short || t.label) : ''; };
  render(`
    <div class="card hero">
      <p class="eyebrow">シールを貼るマス</p>

      <h2 class="sec">近くのサポーター</h2>
      <p class="note" style="margin-top:-4px">マップに名前がある人です（内定済みの4年生）。近くの人でも、反対側の人でも、話してみると発見があります。${same.length ? '' : 'この区画にはサポーターがいないので、となりの区画の人の話も聞いてみよう。'}</p>
      <ul class="near">${near.map(x => `<li>${markHtml(x.s)}${esc(x.s.industry)}　<span class="chip soft">${esc(x.quad.name)}</span>${x.s.note ? `<br><span class="note">「${esc(x.s.note)}」</span>` : ''}${(x.s.themes || []).length ? `<br><span class="note">話せること：${x.s.themes.slice(0, 3).map(k => esc(short(k))).join('／')}</span>` : ''}</li>`).join('')}</ul>
      <p class="note" style="margin-top:10px"><b>話のきっかけ</b>　「${esc(cell.quad.talk)}」</p>
    </div>

      <p class="note" style="margin-top:-4px">就活の軸の下書きと、考え方が近いサポーターがわかります。今日じゃなくても大丈夫です。</p>
      <div class="stack"><button class="primary go" id="qfull">${ITEMS.length}問の診断をはじめる</button><button class="ghost wide" id="qagain">次の人がやる（最初から）</button></div>
    </div>`);
  document.getElementById('qfull').onclick = () => { params.quick = false; resetState(); state.fromQuick = { col: cell.col, row: cell.row }; screenIntro(); };
  document.getElementById('qagain').onclick = () => { resetState(); screenQuick(); };
}

/* ------------------------------ 結果 ------------------------------ */
/* タイプ名は「前半＋後半」の区切りで折り返す（単語の途中で改行しない） */

function tendencyHtml(t) {

function rawMapHtml(r) {

function insightsCardHtml(r) {

/* サポーターの名前アイコン（角の丸い四角に下の名前）。会場マップの名前と同じ色 */
function markHtml(s, cls) {
  return `<span class="${cls || 'mk'}" style="background:${markOf(s).color}">${esc(displayName(s))}</span>`;
}
function tendencyName(id) { const T = TENDENCIES.find(x => x.id === id); return T ? T.name : ''; }
/* 結果画面の小さな2軸マップ：サポーターの位置（名前アイコン）と、6問で貼ったマス（枠と★。opts.cell）。14問の結果では座標を出さない（opts.noStar） */
function miniMapSvg(r, highlight, opts) {
  const plan = mapPlan(), C = 60, P = 22, S = C * (CARD_N + 1), W = S + P * 2;
  const qs = mapQuadrants(), L = mapLabels();
  const out = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${W}" font-family="${POSTER_FONT}" role="img" aria-label="会場の2軸マップ。あなたは${esc(r.map.label)}">`];
  out.push(`<rect width="${W}" height="${W}" fill="#ffffff"/>`);
  qs.forEach(q => {
    const x = P + (q.corner[1] === 'R' ? S / 2 : 0), y = P + (q.corner[0] === 'B' ? S / 2 : 0);
    out.push(`<rect x="${x}" y="${y}" width="${S / 2}" height="${S / 2}" fill="${QUAD_TINT[q.corner]}"/>`);
  });
  for (let k = 1; k <= CARD_N; k++) {
    const mid = k * 2 === CARD_N + 1, w = mid ? 1.6 : 0.6, c = mid ? PX.muted : PX.border;
    out.push(`<line x1="${P + k * C}" y1="${P}" x2="${P + k * C}" y2="${P + S}" stroke="${c}" stroke-width="${w}"/><line x1="${P}" y1="${P + k * C}" x2="${P + S}" y2="${P + k * C}" stroke="${c}" stroke-width="${w}"/>`);
  }
  out.push(`<rect x="${P}" y="${P}" width="${S}" height="${S}" fill="none" stroke="${PX.muted}" stroke-width="1"/>`);
  qs.forEach(q => {
    const x = P + (q.corner[1] === 'R' ? S / 2 : 0), y = P + (q.corner[0] === 'B' ? S / 2 : 0);
    out.push(svgText(x + S / 4, y + (q.corner[0] === 'T' ? 16 : S / 2 - 8), q.name, { size: 11, weight: 700, fill: QUAD_INK[q.corner], anchor: 'middle', max: S / 2 - 6, halo: 3 }));
  });
  out.push(svgText(P, P - 7, '↑ ' + L.top, { size: 11, fill: PX.muted }) + svgText(P, W - 6, '↓ ' + L.bottom, { size: 11, fill: PX.muted }));
  out.push(svgText(P + S, P - 7, L.left + ' ← → ' + L.right, { size: 11, fill: PX.muted, anchor: 'end' }));
  /* 同じマスのサポーターは、マスの中で少しずつずらす */
  seniorSpots(plan).forEach(x => {
    const cx = P + (x.col + 0.5 + x.dx) * C, cy = P + (CARD_N + 0.5 - x.row + x.dy) * C;
    out.push(nameIcon(cx, cy, x.s, { size: x.n > 3 ? 8 : 9.5, h: x.n > 3 ? 12 : 15, max: C - 6, on: highlight && highlight.indexOf(x.s) >= 0 }));
  });
  if (opts && opts.cell) {
    /* スマホ6問の結果：シールを貼るマスを太い枠で囲み、★はマスの左上の角に置く（マスの中の名前を隠さない） */
    const cx0 = P + opts.cell.col * C, cy0 = P + (CARD_N - opts.cell.row) * C;

/* サポーターごとの、マスの中での置き場所（マスの幅を1としたずれ）。名前アイコンは横に長いので、同じマスの人は縦に並べる（50音順）。

function seniorSpots(plan) {
  const groups = {};
  plan.seniors.forEach(x => { const k = x.col + ',' + x.row; (groups[k] = groups[k] || []).push(x); });

  Object.keys(groups).forEach(k => {
    const g = groups[k].slice().sort((a, b) => displayName(a.s).localeCompare(displayName(b.s), 'ja')), n = g.length, step = n <= 3 ? 0.28 : 0.84 / n;

function submit(payload, after) {

    if (!res || !res.ok) state.mail = { status: 'error', code: (res && res.code) || 'SERVER', to };
    else state.mail = { status: res.mailed ? 'sent' : 'notsent', code: res.code, to };
    state.mail.demo = mailIsDemo();
    updateMailStatus();
    if (state.refreshReceive) state.refreshReceive();
    const cta = document.getElementById('cta');
    if (cta && state.mail.status !== 'error') cta.classList.add('off');
  };
  if (IS_GAS) {
    google.script.run.withSuccessHandler(done).withFailureHandler(() => done({ ok: false, code: 'NETWORK' })).submitReport(payload);

    /* 公開ページ（GitHub Pages）から、メール送信用の Apps Script に送る。text/plain にすると、事前の確認なしで送れて結果も読める */
    fetch(CONFIG.mailEndpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' })
      .then(res => res.json()).then(done, () => done({ ok: false, code: 'NETWORK' }));
